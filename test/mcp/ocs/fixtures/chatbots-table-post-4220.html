<!--
  /a/connect-ace/chatbots/table/ — the CURRENT (post-OCS-PR-#4220) row shape.

  Re-derived from upstream SOURCE at dimagi/open-chat-studio (default branch,
  read 2026-08-23), not guessed:

    apps/chatbots/tables.py        ChatbotTable.name = ActionsColumn([chip_action(
                                     label_factory=_name_label_factory,
                                     url_factory=_chip_chatbot_url_factory,
                                     button_style=actions.CHIP_BUTTON_STYLE,
                                     truncate=True)])
                                   Meta.row_attrs = {**DJANGO_TABLES2_ROW_ATTRS,
                                     "data-redirect-url": _chatbot_url_factory}
                                   Meta.empty_text = "No chatbots found."
    config/settings.py             DJANGO_TABLES2_ROW_ATTRS -> class (multi-line),
                                   id = f"record-{record.id}", data-redirect-url
    templates/generic/crud_actions_column.html   wraps actions in <div class="join …">
    templates/generic/action.html  <a … class="btn btn-sm join-item {{ button_style }}
                                     {% if truncate %} max-w-xs{% endif %}">
                                     {% include "generic/chip_label.html" %}
                                     {% if icon_class %}<i …></i>{% endif %}</a>
    templates/generic/chip_label.html  truncate ->
                                     <span class="min-w-0 truncate" title="{{ label }}">{{ label }}</span>

  PR #4220 "Consistent chip rendering in tables", merged 2026-08-18T11:56Z, is
  what moved the label from `{{ label }}` into that <span>. See ace#1561.

  Rows here cover: an ordinary bot, a Django-escaped ampersand in the name, and
  an archived bot (`_name_label_factory` appends " (archived)").
-->

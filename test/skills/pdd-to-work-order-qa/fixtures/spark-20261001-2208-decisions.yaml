- id: solicitation-all-in-rate-and-devices
  phase: 8-solicitation-management
  skill: solicitation-create
  question: How is the rate framed on the listing, and where do device costs sit?
  ai-default: All-in, devices inside the rate
  options:
  - All-in, devices inside the rate
  - Devices costed separately (work order §2)
  reasoning: Standing operator directive (2026-09-08) requires an all-in per-verified-unit rate with no separately-funded line and an explicit worker-vs-organisation split (ace#2265). The PDD band (MWK 5,000-10,000 to the CBF + MWK 3,000 organisation floor, both PROPOSED; Phase 4 payment unit 7,500 + 3,000) is shown as an indicative all-in MWK 8,000-13,000. This deviates from work order §2 / PDD §12, which let the partner cost device provision separately; the listing instead asks how any device gap is carried inside the rate. The work order text should be reconciled at contract execution.
  source: PDD §10.1, §12, §14; work order §2, §6.2; run_state connect-setup payment_units
  superseded_by: sol-devices-and-system-of-record-2208
  status: ai-default
  value_set_by: external
  evidence_basis: conflicting
  conflict_signals:
  - 'Work order §2 / PDD §12: device provision costed separately, funded only if Dimagi agrees'
  - 'Operator directive 2026-09-08 (solicitation-create design principle): rate is all-in, never invite a separately-funded line'

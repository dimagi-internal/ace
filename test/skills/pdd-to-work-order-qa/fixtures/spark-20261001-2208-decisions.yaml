  reasoning: 'Standing operator directives: devices, data and system of record are ASSUMED, never asked (2026-09-26), and the rate is ALL-IN with an explicit worker vs commodity split and no separately-funded line (2026-09-08, ace#2265). The PDD §12 / work order §2 device go/no-go and separately-costed device plan, and the instead-of/in-addition-to filing ask, are therefore omitted from the listing. Indicative all-in band shown as MWK 8,000-13,000 (CBF 5,000-10,000 + organisation 3,000, both PROPOSED). Work order §2/§6.1 text should be reconciled at contract execution.'

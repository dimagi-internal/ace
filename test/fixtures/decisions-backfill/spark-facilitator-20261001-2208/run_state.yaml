    products:
      pdd:
        title: Spark Facilitator — Connect Pilot for FCAP Community Meeting Facilitation
        description: "A Connect verify-and-pay layer under Spark MicroGrants' Community
          Based Facilitators: each CBF records FCAP community meetings on a form
          built from Spark's Village Monitoring Form, and Connect pays per
          meeting verified as meeting_conducted = yes AND meeting_type =
          community_meeting, capped at 3 paid meetings per community per FCAP
          step. The pilot covers Goal Setting (steps 1-7, ~3 months) for ~12
          communities in one Malawi district, with facilitator registration,
          per-meeting monitoring and savings in scope."
        file_id: 1iEuQY_hpcCImQeY-pyhjYDYTNfTC2cOTN-pDT1aIqNA
        program_parameters:
          archetype: longitudinal-visits
          learn_passing_score: 80

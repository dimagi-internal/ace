      - One payable meeting per step
      - Every meeting payable
    reasoning: "Steps take ~1.9 meetings on average, so one-per-step would leave real continuation work unpaid. This run closes the out-of-order gap: the step pointer only moves forward by one, so a meeting cannot be recorded against an earlier or skipped step; revisiting earlier content counts against the current step."
    source: ACE inference from weekly cadence (~13 meetings over 7 steps); prior eval WARN on out-of-order silence
    status: ai-default
    value_set_by: ace
    evidence_basis: inferred

    products:
      pdd:
        title: Spark Facilitator — Connect Pilot for FCAP Community Meeting Facilitation
        description: "A Connect verify-and-pay layer under Spark MicroGrants' Community
          Based Facilitators: each CBF records FCAP community meetings on a form
          built from Spark's Village Monitoring Form, and Connect pays per
          meeting verified as meeting_conducted = yes AND meeting_type =
          community_meeting, capped at 3 paid meetings per community per FCAP
          step. The pilot covers Goal Setting (steps 1-7, ~3 months) for ~12
          communities in one Malawi district, with facilitator registration,
          per-meeting monitoring and savings in scope."
        file_id: 1rR_GEZv6J8FGP7iUYs9zwBZO_bICBOyRZI9tQTOEEqI
        program_parameters:
          archetype: longitudinal-visits
          learn_passing_score: 80
          assessment_items: 12
          payment_rate_band:
            currency: MWK
            min: 5000
            max: 10000
            unit: verified community meeting
            status: PROPOSED
          llo_payment_per_visit:
            amount: 3000
            currency: MWK
            status: PROPOSED
          daily_cap: 1
          total_cap: 21
          campaign_target_visits: 156
          flw_count_min: 12
          flw_count_max: 12
          expected_reach_min: 12
          expected_reach_max: 12
          total_budget:
            amount: 3276000
            currency: MWK
            status: PROPOSED
          opportunity_start_date: "2026-11-02"
          opportunity_end_date: "2027-02-26"
          opportunity_dates_status: PROPOSED
          verification_flags:
            form_field_rules:
              - field: meeting_conducted
                equals: "yes"
              - field: meeting_type
                equals: community_meeting
            duplicate: false
            gps: false
          connect_delivery_type: ace
          opportunity_country: MWI
          opportunity_currency: MWK
          entity_id_grain: concat(case_id, '-', pilot_fcap_step, '-',
            min(step_meeting_index, 3)) — step_meeting_index is the
            post-increment value (first meeting on a step = 1)
          entity_state_taxonomy: "1=Our Partnership (steps 1); 2=Community Dynamics,
            Governance & Leadership (steps 2); 3=Understanding the Present –
            Situational Analysis (steps 3); 4=Getting to the Future – Microgrant
            Pathway & Goals (steps 4); 5=Initiative Pathway & Savings (steps 5);
            6=Advocacy Pathway (steps 6); 7=Vision (steps 7) [source: FCAP
            Structure, Phases, and Activities (Spark, shared 2026-07-21).pdf]"
          cap_rationale: 7 FCAP steps x 3 payable meetings per step = 21 structural
            maximum per CBF; ~13 expected at weekly cadence
          verification_predicate: meeting_conducted = yes AND meeting_type = community_meeting
          working_language:
            - en
            - nya
            - tum
          app_runtime_default_language: en
          verification_layers: A+B+C
          layer_b_review_sample: ">=20% of paid meetings independently checked,
            risk-stratified; plus 10% of unpaid records"
          layer_c_call_sample: ">=10% of paid meetings in consenting communities"

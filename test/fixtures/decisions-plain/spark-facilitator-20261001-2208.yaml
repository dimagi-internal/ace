    reasoning: "Connect pays a repeated entity_id again with the duplicate flag off, so the cap needs a Connect-side form_field_rules row on payable_slot = yes (ace#2512); entity_label shows (not paid). Spot-check: Deliver app › Community Meeting Record › entity_key."

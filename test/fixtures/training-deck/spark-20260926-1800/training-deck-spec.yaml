modules:
  - id: "welcome"
    title: "Welcome & Introductions"
    slides:
      - id: "cover"
        layout: "cover"
        title: "Spark Facilitator"
        subtitle: "FLW Training"
        date: "September 2026"
        notes: "Welcome everyone and introduce yourself and the organisation. Explain that today covers how to record FCAP community meetings on the phone and how payment works, not how to facilitate FCAP, which they already do. Ask people to keep their phones charged and ready; there are hands-on parts."
      - id: "agenda"
        layout: "agenda"
        title: "Today's Agenda"
        items:
          - label: "Welcome"
          - label: "Setting up Connect"
          - label: "Your opportunity: Learn, Deliver, Verify, Pay"
          - label: "Practice"
          - label: "Check and next steps"
          - label: "Help and resources"
        notes: "Highlight that the Deliver part, especially the Community Meeting Record, is the most important for getting paid correctly, and that there is hands-on practice after it. Take questions at the end of each part rather than holding them all to the end."
      - id: "icebreaker"
        layout: "exercise"
        title: "Two Truths and a Lie"
        body: "Each person shares three statements about themselves: two true, one false. The group guesses which one is the lie. Go around the room until everyone has had a turn."
        notes: "With about twelve CBFs this works well. Keep it light and fast. If the group already knows each other well, ask for statements about their communities instead, which also warms people up for the community-focused content that follows."
  - id: "platform-setup"
    title: "Connect Platform Setup"
    common: true
    slides:
      - id: "what-is-connect"
        layout: "content"
        title: "What is Connect?"
        body: "Connect matches you with paid work opportunities:

          - Learn: Complete training modules on your phone

          - Deliver: Do field work using guided forms

          - Verify: Your work is checked for quality

          - Pay: Get paid for verified, quality work\n"
        notes: "Talk through this slide in plain words and check understanding before moving on."
      - id: "install-commcare"
        layout: "content"
        title: "Step 1: Download CommCare"
        body: "Open the Play Store, search for \"CommCare\", tap Install, then tap Open. When CommCare opens you see its welcome screen."
        notes: "Most CBFs will have CommCare installed during onboarding. If anyone installs now, make sure it is the CommCare app by Dimagi. The Play Store screens are not in the common screenshot pool, so this slide is text-only."
      - id: "personal-id-start"
        layout: "mobile_flow"
        title: "Step 2: Create Your PersonalID"
        steps:
          - image: "@personal-id-start"
            caption: "Tap 'Sign Up'"
          - image: "@personal-id-name"
            caption: "Enter your name"
          - image: "@personal-id-phone"
            caption: "Enter your phone number"
        notes: "Talk through this slide in plain words and check understanding before moving on."
      - id: "personal-id-details"
        layout: "content"
        title: "Step 2 (continued): Complete Your Profile"
        body: "Enter the code sent to your phone, take your photo, and allow location access when your phone asks. Your PersonalID is then ready to use."
        notes: "These screens differ slightly by phone. If the code does not arrive, wait a minute and try again, then ask the coordinator. The screenshots for this part are template artwork that has not been made yet, so this slide is text-only."
      - id: "connect-home"
        layout: "walkthrough"
        title: "Find Your Opportunity in Connect"
        image: "@claim-opp-new-tile"
        body: "Connect shows your opportunities as cards. Find the card named \"Spark Facilitator — FCAP Community Meeting Facilitation\" and tap View Opportunity. Your list may show other cards too."
        notes: "The common connect-home frame is a placeholder showing another opportunity, so this slide uses this run's own capture. The card shows the last day of the project, 26 February 2027. If a CBF cannot find the card, check they are signed in with the phone number the organisation invited."
      - id: "claim-opportunity"
        layout: "walkthrough"
        title: "Open the Opportunity and Tap Start"
        image: "@claim-opp-detail"
        body: "The opportunity page says what you are paid for and lists the Learn sections. Read it, then tap Start. Connect may list the sections in a different order from the app; follow the app."
        notes: "The common claim-opp frame is a placeholder and its caption named a \"Claim\" button that this version does not show; the button is Start. Point out the description line: paid per verified community meeting, up to 3 per step and 1 per day, committee meetings not paid."
      - id: "install-learn"
        layout: "walkthrough"
        title: "Installing the Learn App"
        image: "@learn-install"
        body: "After you tap Start, CommCare downloads the Learn app. Wait for the download to finish; the Learn sections then appear on your screen as tiles."
        notes: "The download needs network, so do this step where there is signal. This picture is from the shared screenshot set of an earlier app version; the progress screen looks similar. If the download stalls, close CommCare and reopen it."
      - id: "syncing"
        layout: "content"
        title: "Keeping Your Data in Sync"
        body: "Your phone keeps records even without network. Tap Sync with Server on the Deliver home after each record, whenever you have network, so the record reaches Connect."
        notes: "The earlier template text mentioned a green check mark that this run did not verify, so the slide now names the Sync with Server tile the CBFs will actually tap. Encourage syncing on the same day as the meeting."
  - id: "your-opportunity"
    title: "Your Opportunity"
    slides:
      - id: "opp-overview"
        layout: "content"
        title: "What This Pilot Is"
        body: "You already facilitate your community's weekly FCAP Goal Setting meetings (Steps 1 to 7). In this pilot you also record each meeting on your phone, and Connect pays you for each verified community meeting.


          Nothing about how you run FCAP changes. You learn only how to record meetings and how payment works."
        notes: "Open by making clear this is not new facilitation training: the CBFs already know FCAP. Ask who has used a phone form before, and who has filled Spark's own Village Monitoring Form. Stress that the pilot adds a record and a payment, nothing else. If someone asks whether this replaces Spark's form, say that decision sits with Spark and the organisation, and note the question for the coordinator."
      - id: "opp-pillars"
        layout: "content"
        title: "Four Parts: Learn, Deliver, Verify, Pay"
        body: "- Learn: finish eight short sections and pass the final assessment.

          - Deliver: register once, enrol your community once, then record every meeting.

          - Verify: each record is checked automatically and some are reviewed by people.

          - Pay: you are paid for each verified community meeting."
        notes: "Walk the four words slowly and tell the room that the rest of the session follows exactly this order, so they can find their place again later. Point out that \"Verify\" is not about catching people out: it is how the programme can show that payments went to meetings that really happened, which protects the CBFs who do the work honestly."
      - id: "section-learn"
        layout: "section"
        title: "Learn"
        notes: "Transition: \"First, what you need to know.\" Explain that the Learn app opens right after they tap Start on the opportunity in Connect, and that it has eight tiles on one screen. Tell them the order in the app is the order to follow, even if Connect lists the lessons in a different order on the opportunity page."
      - id: "learn-before-you-start"
        layout: "walkthrough"
        title: "Before you start"
        image: "@journey-learn-m0-q1-answered"
        body: "A 6-question starting quiz. It does not count toward anything; it shows you what you already know before the lessons."
        notes: "Read the title exactly as it appears on the tile in the app. A 6-question starting quiz. It does not count toward anything; it shows you what you already know before the lessons. Ask one person to say in their own words why this section matters for getting paid correctly, and correct gently if the answer drifts toward facilitation technique rather than recording."
      - id: "learn-your-role-in-this-pilot"
        layout: "content"
        title: "Your role in this pilot"
        body: "What the pilot pays for, that FCAP itself does not change, and who reviews your records."
        notes: "Read the title exactly as it appears on the tile in the app. What the pilot pays for, that FCAP itself does not change, and who reviews your records. Ask one person to say in their own words why this section matters for getting paid correctly, and correct gently if the answer drifts toward facilitation technique rather than recording."
      - id: "learn-registering-yourself-and-your-community"
        layout: "walkthrough"
        title: "Registering yourself and your community"
        image: "@journey-learn-m2-register-finished"
        body: "Register yourself once and enrol your community once, count the households carefully, and respect a contact who says no to calls."
        notes: "Read the title exactly as it appears on the tile in the app. Register yourself once and enrol your community once, count the households carefully, and respect a contact who says no to calls. Ask one person to say in their own words why this section matters for getting paid correctly, and correct gently if the answer drifts toward facilitation technique rather than recording."
      - id: "learn-recording-a-meeting"
        layout: "content"
        title: "Recording a meeting"
        body: "The Community Meeting Record screen by screen: the photo, working the community list, and recording a meeting that did not happen."
        notes: "Read the title exactly as it appears on the tile in the app. The Community Meeting Record screen by screen: the photo, working the community list, and recording a meeting that did not happen. Ask one person to say in their own words why this section matters for getting paid correctly, and correct gently if the answer drifts toward facilitation technique rather than recording."
      - id: "learn-counting-attendance-and-participation"
        layout: "content"
        title: "Counting attendance and participation"
        body: "Count households represented, men and women who came, and men and women who spoke, on the day. Speakers can never be more than attendees."
        notes: "Read the title exactly as it appears on the tile in the app. Count households represented, men and women who came, and men and women who spoke, on the day. Speakers can never be more than attendees. Ask one person to say in their own words why this section matters for getting paid correctly, and correct gently if the answer drifts toward facilitation technique rather than recording."
      - id: "learn-steps-and-savings"
        layout: "content"
        title: "Steps and savings"
        body: "The seven FCAP Goal Setting steps: the step is read from the record and moves forward only when the community completes it. Savings questions appear only from Step 5."
        notes: "Read the title exactly as it appears on the tile in the app. The seven FCAP Goal Setting steps: the step is read from the record and moves forward only when the community completes it. Savings questions appear only from Step 5. Ask one person to say in their own words why this section matters for getting paid correctly, and correct gently if the answer drifts toward facilitation technique rather than recording."
      - id: "learn-how-payment-works"
        layout: "content"
        title: "How payment works"
        body: "What makes a meeting payable: a held community meeting, at most 3 per step and 1 per day. Committee meetings and meetings that did not happen are recorded but not paid."
        notes: "Read the title exactly as it appears on the tile in the app. What makes a meeting payable: a held community meeting, at most 3 per step and 1 per day. Committee meetings and meetings that did not happen are recorded but not paid. Ask one person to say in their own words why this section matters for getting paid correctly, and correct gently if the answer drifts toward facilitation technique rather than recording."
      - id: "learn-final-assessment"
        layout: "walkthrough"
        title: "Final assessment"
        image: "@journey-learn-m7-q12-last-item-result"
        body: "Twelve questions on the pilot rules. You pass at 80% (10 of 12) and can retake it as many times as you need. Passing unlocks the Deliver app."
        notes: "Read the title exactly as it appears on the tile in the app. Twelve questions on the pilot rules. You pass at 80% (10 of 12) and can retake it as many times as you need. Passing unlocks the Deliver app. Ask one person to say in their own words why this section matters for getting paid correctly, and correct gently if the answer drifts toward facilitation technique rather than recording."
      - id: "your-community"
        layout: "content"
        title: "Your Community"
        body: "You facilitate one community, and that community is your record in the app. The app remembers which FCAP step it is on and how many meetings are recorded on that step.


          You enrol it once. After that, every meeting you record is for that community."
        notes: "This replaces the usual \"who you will visit\" slide: in this pilot the CBF does not visit households, she records meetings for one community. Make sure everyone knows the exact community name and Spark community ID they will use at enrolment; the ID comes from the supervisor if they do not know it."
      - id: "section-deliver"
        layout: "section"
        title: "Deliver"
        notes: "Transition: \"Now the work itself.\" There are three forms. Two are done once (registration and enrolment) and one is done after every meeting. Tell the room the payable one is the Community Meeting Record; the other two are needed first but are not paid."
      - id: "form-1-facilitator-registration"
        layout: "walkthrough"
        title: "Form 1: Facilitator Registration"
        image: "@journey-deliver-reg-about-you"
        body: "Tap Start, then Facilitator, then Facilitator Registration. Enter your full name, gender, age in years and highest level of school, then your 10-digit phone number and where you work. Do this once only."
        notes: "Show the About you screen. Common mistakes: typing a 9-digit phone number (the form asks for exactly 10 digits) and registering a second time after a new SIM card. If the form ever says \"This facilitator is already registered\", the CBF must stop and call the coordinator rather than continue."
      - id: "form-2-community-enrolment"
        layout: "walkthrough"
        title: "Form 2: Community Enrolment"
        image: "@journey-deliver-enrol-households"
        body: "Tap Start, then Facilitator, then Community Enrolment, and pick your own name. Enter the community name and ID, where it is, the households and average household size, and the contact person. Count the households carefully."
        notes: "The household number matters more than it looks: every meeting's households-represented answer is checked against it. The form accepts 1 to 400. Also walk through the contact screen: the CBF reads the call statement aloud and records yes or no. A no keeps the community in the pilot; it only means no confirmation calls."
      - id: "form-3-community-meeting-record"
        layout: "walkthrough"
        title: "Form 3: Community Meeting Record"
        image: "@journey-deliver-about-this-meeting"
        body: "After every meeting: tap Start, then Community meetings, and pick your community. Answer whether the meeting happened, choose Community meeting or Committee meeting, and tap RECORD LOCATION at the meeting place."
        notes: "This is the form they will use every week. Point to the two questions on this screen that decide payment: did it happen, and was it a community meeting. If the meeting did not happen, they answer No, pick the reason and a new date, and the form ends there. Location is for review only and never blocks submitting."
      - id: "meeting-step"
        layout: "walkthrough"
        title: "The Step Is Shown, Not Chosen"
        image: "@journey-deliver-step-display"
        body: "The app shows the FCAP step your community is on, for example \"Step 1: Our Partnership\". You do not choose it. It moves forward only when you answer Yes to \"Did the community complete Step N at this meeting?\"."
        notes: "Many CBFs are used to Spark's form asking which step the village is in. Here the step is read from the record. Ask: \"What happens if you tap Yes by mistake?\" Answer: it cannot be moved back in the app, so they call the coordinator, and the supervisor fixes it on CommCare HQ."
      - id: "meeting-photo"
        layout: "walkthrough"
        title: "The Meeting Photo"
        image: "@journey-deliver-photo-attached"
        body: "Read the photo statement aloud to the meeting first, then answer that you read it. Tap TAKE PICTURE and take one wide photo of the people gathered, during the meeting. The app uses the camera only."
        notes: "Point to the screen: there is only a TAKE PICTURE button. No close-ups and no selfies are needed. If the meeting does not want a photo taken, the CBF does not take one and calls the coordinator; the app will not save a held meeting without the statement and a photo."
      - id: "meeting-counts"
        layout: "walkthrough"
        title: "Who Came and Who Spoke"
        image: "@journey-deliver-who-came"
        body: "Enter the households represented, the males and females who attended, and the males and females who spoke. Count on the day. People who spoke can never be more than people who attended."
        notes: "Run a quick example: 30 women came and 34 spoke. Ask what went wrong (late arrivals were not counted) and what to do (go back and raise the attendance count). The hint on the first question shows the community's enrolled households, which is the upper limit for households represented."
      - id: "meeting-step-progress"
        layout: "walkthrough"
        title: "Step Progress"
        image: "@journey-deliver-step-progress"
        body: "Answer Yes only if the community really finished the step today. The step then moves forward by one and cannot be moved back in the app. If unsure, answer No."
        notes: "This single answer changes the community record for every later meeting, so it deserves a pause. The savings questions appear from Step 5; before that their absence is correct, not a bug. Ask someone to explain why \"No\" is the safe answer when unsure."
      - id: "meeting-finish"
        layout: "walkthrough"
        title: "Notes, Payment Note and FINISH"
        image: "@journey-deliver-notes-last-item"
        body: "Add an optional note. The screen tells you whether this meeting can be paid, for example \"meeting 1 of 3 on this step\". Tap FINISH, then Sync with Server when you have network."
        notes: "The payment note is written by the app from the community record, so it is a good self-check. Remind the room to sync on the same day so the record reaches Connect. Before the pilot start date the Deliver home shows \"The job has not started yet\"; that is expected."
      - id: "section-verify"
        layout: "section"
        title: "Verify"
        notes: "Transition: \"How your records are checked.\" Explain there are three layers: automatic checks on every record, a human review of a sample, and short phone calls to community contacts who agreed. None of this is about suspicion; it is how payments stay trustworthy."
      - id: "verify-rules"
        layout: "content"
        title: "What Makes a Meeting Verified"
        body: "- The meeting happened and was a community meeting.

          - You are the CBF who enrolled the community.

          - A live photo is attached.

          - Speakers are not more than attendees, and households are not more than enrolled.

          - It is dated after the last community meeting recorded for your community."
        notes: "These are the automatic checks. Location and the photo are also reviewed by people, but neither stops a submission. A supervisor looks at the photos each week and compares them with earlier meetings, so an old photo will be noticed."
      - id: "verify-review"
        layout: "content"
        title: "Reviews and Confirmation Calls"
        body: "A supervisor reviews at least 1 in 5 paid meetings, focusing on unusual records. Sometimes a Partner Trainer attends your next meeting.


          If your community contact agreed, a supervisor may phone them to ask whether the meeting took place and roughly how many came."
        notes: "Unusual records include identical attendance two meetings running, a location far from the community, a photo that looks like an earlier one, and a step marked complete after one meeting. Say plainly that an identical count is not an error and does not stop payment; it only means someone takes a second look."
      - id: "section-pay"
        layout: "section"
        title: "Pay"
        notes: "Transition: \"How you get paid.\" Keep this part concrete. Remind the room that the amounts shown are what Connect is set up with today and the organisation will confirm the final rate at onboarding."
      - id: "pay-stats"
        layout: "stats"
        title: "Payment"
        stats:
          - big: "7,500 MWK"
            label: "Per verified community meeting"
          - big: "1 per day"
            label: "Paid meetings per day"
          - big: "3 per step"
            label: "Paid meetings per FCAP step (21 total)"
        notes: "7,500 MWK is the amount configured in Connect for this pilot. It is a proposed figure and the organisation confirms the final rate. A 4th meeting on the same step is recorded in full but not paid. Committee meetings and meetings that did not happen are recorded but not paid. You are paid per verified meeting, not per hour or per person."
      - id: "safety-ethics"
        layout: "content"
        title: "Consent, Privacy and Safety"
        body: "- Read the photo statement aloud before every photo. If people do not want a photo, do not take one.

          - Read the call statement to the community contact at enrolment. A No keeps the community in the pilot.

          - Your phone holds photos and contact numbers: keep it locked, and report a lost phone at once.

          - If you feel unsafe, leave and call your coordinator."
        notes: "Both statements are on the screens in the app, so the CBF reads them rather than improvising. Consent can be refused, and that is not the CBF's failure. Anything involving harm to a person or a threat to the CBF goes straight to the coordinator; the app is not the place to report it."

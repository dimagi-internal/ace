        body: "Open the Learn app and complete \"Final assessment\" now. You pass at 80% (10 of 12); you can retake it. Raise your hand if you get stuck."
        notes: "Let people work at their own pace. Walk the room and watch for anyone stuck on the tile screen: each section opens to a single tile that must be tapped to start. For \"Final assessment\", the most common question is about the rule it teaches; answer from the app's own wording."
      - id: "form-practice"
        layout: "exercise"
        title: "Fill Out a Sample Form"
        body: "Working with a partner, fill out the Community Meeting Record for a practice meeting. Use made-up numbers for attendance and speakers. Compare your answers when you are done."
        notes: "Give each pair a short scenario: a held community meeting at Step 1 with 40 people. Ask one pair to deliberately enter more speakers than attendees so the room sees the form stop them. Remind them not to submit practice records on a live account."
      - id: "role-play"
        layout: "exercise"
        title: "Simulated Community Meeting Record"
        body: "Pair up. One person plays the community contact, the other is the CBF. Read the photo statement and the call statement aloud, then record the meeting from start to FINISH. Switch roles and repeat."
        notes: "The point of this role play is the two read-aloud statements. Coach the person playing the contact to sometimes say no, so the CBF practises accepting a refusal without pressure and knowing what happens next."
  - id: "evaluation"
    title: "Evaluation & Next Steps"
    slides:
      - id: "knowledge-check"
        layout: "exercise"
        title: "Knowledge Check"
        body: "1. Is a committee meeting paid?

          2. Can speakers be more than attendees?

          3. How many meetings on one step can be paid?

          4. Who chooses the FCAP step on the form?

          5. A planned meeting did not happen. Do you record it?"
        notes: "Answers: 1) No, it is recorded but not paid. 2) No, never. 3) Three; a 4th is recorded but not paid. 4) Nobody: the app reads it from the record, and it moves only when you answer that the step was completed. 5) Yes, with the reason and a new date; it is not paid."
      - id: "readiness"
        layout: "checklist"
        title: "Field Readiness Checklist"
        items:
          - "Phone charged and CommCare opens"
          - "PersonalID set up with your own number"
          - "All eight Learn sections done; final assessment passed"
          - "Facilitator Registration filed once"
          - "Community Enrolment filed once"
          - "Synced after your last record"
        notes: "Go down the list with each person. The most common gap is not having synced. If someone has not passed the final assessment yet, they cannot record meetings: the Deliver app unlocks only after passing."
      - id: "next-steps"
        layout: "content"
        title: "Next Steps"
        body: "Delivery starts on 2 November 2026 and runs to 26 February 2027. Before 2 November, your phone shows \"The job has not started yet\"; that is expected.


          Record every meeting on the same day and sync. Call your coordinator with any question."
        notes: "Confirm each CBF knows the coordinator's name and phone number and has written it on their quick reference card. Remind them that the first meeting they record after enrolment will be on Step 1: Our Partnership."
  - id: "resources"
    title: "Resources & Help"
    slides:
      - id: "where-to-get-help"
        layout: "content"
        title: "Where to Get Help"
        body: "- Your coordinator: for any question about recording, payment or your community. Write their name and phone on your quick reference card.

          - Quick Reference Card: keep it with you in the field

          - FAQ Document: answers to the most common questions

          - Connect Help Site: https://dimagi.atlassian.net/wiki/spaces/connectpublic/pages/3146907771/Connect+Mobile+Application"
        notes: "The support chatbot is not reachable from inside the Connect app for this opportunity, so the coordinator is the first contact. The help site is optional reading; everything required is in this session."
      - id: "learn-more"
        layout: "content"
        title: "Learn More About Connect"
        body: "The Connect Help Site covers the platform in more detail than we can today:


          - Setting up your account: https://dimagi.atlassian.net/wiki/spaces/connectpublic/pages/3146907799/ConnectID+Signup

          - Using the app day to day: https://dimagi.atlassian.net/wiki/spaces/connectpublic/pages/3146907771/Connect+Mobile+Application

          - How visits get verified: https://dimagi.atlassian.net/wiki/spaces/connectpublic/pages/3146940710/Verify+Approve+Visits+by+a+Connect+Worker

          - How and when you get paid: https://dimagi.atlassian.net/wiki/spaces/connectpublic/pages/3214966794/Payments+for+Verified+Service+Delivery


          You do not need any of these to start work — everything required is in this session.\n"
        notes: "These links are supplementary. Offer them to anyone who wants more depth, and to the coordinator for follow-up questions. Nobody needs them to start work."
      - id: "closing"
        layout: "closing"
        title: "Thank You"
        body: "You are ready to start.


          Remember:

          - Pass the final assessment before your first meeting

          - Record every meeting on the same day and sync

          - Call your coordinator whenever you have a question


          Good luck!"
        notes: "Close by thanking the group and repeating the three reminders. Collect any open questions for the coordinator and confirm when the first meetings are expected after 2 November 2026."

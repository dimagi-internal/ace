        title: Newborn Care Companion Classes in Kano State, Nigeria
        description: An illustrative design, built only from public information, for
          running newborn care classes for families in Kano State, Nigeria through
          Connect, modeled on Noora Health's Care Companion Program. Trained caregiver
          educators run short group classes in hospital postnatal wards that teach
          mothers, fathers and grandmothers breastfeeding, skin-to-skin care, cord
          care and the newborn danger signs. Connect pays for each class an educator
          records with at least three family caregivers present and the danger signs
          covered.

# Appended after the operator asked for a full open-backlog scan before
# implementing #796 and #856. Read-only pass over all 75 remaining open
# issues (titles + labels), then targeted reads of the ones that bear on
# either. It materially changed both.
# ---------------------------------------------------------------------------
holistic_scan:
  scanned: 75
  read_in_full: [1094, 873, 1069, 869, 1191]
  finding: >-
    Neither #796 nor #856 is a standalone item. Each is one member of a class,
    and #856 in particular would have shipped a gate that hard-fails every run
    if implemented in isolation.
clusters_revised:
  - name: which-home-am-i-on
    members: [796, 869, 1191]
    shipped: [863]
    closed_members: [893]
    one_fix: >-
      Make `deliver-home-daily-visits` the canonical Deliver-home signal
      everywhere, and add a static invariant that no recipe uses
      `deliver-home-job-card`/viewJobCard alone to discriminate Learn from
      Deliver. #863 (shipped in PR #1207) is the first adopter.
    note: >-
      #1191's PROPOSED fix (deliver-home-reentry.yaml, a guarded back-loop
      between two deliver-form-walk legs) keys its home anchor on
      `deliver-home-job-card` — the selector #893 disproved. If it ships as
      written it inherits exactly the bug #863 just fixed: it would treat the
      Learn home as the Deliver home and stop backing out one screen early.
      Flagged on PR #1207.
  - name: proceed-with-warn-is-load-bearing
    members: [856, 1094, 1069]
    constraint_member: 873
    one_fix: >-
      A single coverage/readiness predicate with a legal way to say
      "complete for the shape actually executed". #856 is the deck-level
      instance, #1094 the review-offering-level instance (a run reached
      "ready for Sophie" with the Deliver app never device-walked), #1069 the
      status-vocabulary blocker (`partial` is not in PHASE_STATUSES, so a
      supported mode cannot close cleanly and the orchestrator retry-loops).
    blocking_constraint: >-
      #873 is why #856 must NOT be implemented standalone. The PersonalID
      sign-up completion half (OTP -> photo -> permissions -> done) is
      UNCAPTURABLE with the demo test user: +7426 phones bypass SMS OTP
      server-side, and the pre-existing account makes registration an
      account-recovery flow that returns the stored photo, skips the
      permissions dialog, and shows "Account Recovered" instead of "Profile
      complete!". All 5 aliases are marked `placeholder: true` in the SHARED
      common pool, so the entire second half of the sign-up walkthrough is
      text-only in EVERY opp deck, permanently and by design. A naive
      visual-coverage floor fires on that in 100% of runs. The gate must
      whitelist pool-level placeholders and measure only OPP-SPECIFIC
      capture — which is a decision #873 explicitly says is unmade
      ("Fix options (pick one; needs a decision)").

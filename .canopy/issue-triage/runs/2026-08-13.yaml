        StaleArtifactError + --out-scratch + CI detector
        test/scripts/tmp-path-predictability.test.ts). ad62a6f6's commit body
        names this exact repro and module counts.
      close_reason: not planned
      note: "residual it hints at (Step 2 404s on a never-built draft) is #994, not this"
    - number: 1012
      verdict: obsolete
      evidence: >-
        The issue named its own deciding check ("whether the downstream consumer
        that applies the under-six-minutes flag can actually read form meta").
        It cannot: connect-opp-setup/SKILL.md:315-321 (rewritten 2026-08-12 for
        #1013) establishes form_field_rules as the ONLY surface on which a PDD

slug: "{{OPP_SLUG}}"
name: "{{OPP_NAME}}"
program: "{{PROGRAM_NAME}}"
archetype: atomic-visit
template_id: connect-training-atomic
generated_at: "{{GENERATED_AT}}"
source:
  pdd_doc_id: "{{PDD_DOC_ID}}"
  run_id: "{{RUN_ID}}"

# `common` and `opp` are MAPS of alias -> Drive image URL, not scalars.
# Emit `{}` for a pool that resolved to nothing (e.g. no screenshots were
# captured) — `resolveManifest` handles empty maps, and image-bearing layouts
# degrade to `content` as documented. A scalar here fails TrainingDeckSpecSchema.
manifest:
  common: {}   # e.g. { connect-signin-splash: "https://drive.google.com/uc?export=view&id=..." }
  opp: {}      # e.g. { journey-learn-m1-content: "https://drive.google.com/uc?export=view&id=..." }

voice:
  audience: flw
  # No `estimated_duration_minutes` — the LLO owns session timing, so a
  # training deck states no durations anywhere (operator decision 2026-09-09).
  # The field is still optional on the schema for the partnership PITCH deck,
  # which is not a training deck; do not reintroduce it here.
  language: "{{LANGUAGE}}"

modules:
  - id: welcome
    title: "Welcome & Introductions"
    slides:
      - id: cover
        layout: cover
        title: "{{OPP_NAME}}"
        subtitle: "FLW Training — {{DATE}}"
        date: "{{DATE}}"
      - id: agenda
        # `items` is a LIST OF OBJECTS, each with a `label` and nothing else.
        # A list of bare strings fails TrainingDeckSpecSchema. Do NOT add a
        # `duration` key — agenda timing is the LLO's call, and the schema
        # strips the key so it would silently do nothing anyway.
        layout: agenda
        title: "Today's Agenda"
        items:
          - { label: "{{AGENDA_ITEM_1_LABEL}}" }
          - { label: "{{AGENDA_ITEM_2_LABEL}}" }
          - { label: "{{AGENDA_ITEM_3_LABEL}}" }
      - id: icebreaker
        layout: exercise
        title: "{{ICEBREAKER_TITLE}}"
        body: "{{ICEBREAKER_BODY}}"

  - id: your-opportunity
    title: "Your Opportunity"
    slides: "{{OPP_SLIDES}}"

  - id: practice
    title: "Practice & Hands-On"
    slides: "{{PRACTICE_SLIDES}}"

  - id: evaluation
    title: "Evaluation & Next Steps"
    slides: "{{EVALUATION_SLIDES}}"

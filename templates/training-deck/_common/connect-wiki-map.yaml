# Pages present in the space and DELIBERATELY not mapped. Recorded so a
# future editor re-reading the space does not "helpfully" add them back.
excluded:
  - id: 3171778675
    title: "[WIP] CCC FLW Onboarding Guide"
    reason: >-
      Marked [WIP] by its authors. Unstable content must not be linked from a
      deck an LLO reads — the page may change or vanish between the deck being
      built and the training being run.
  - ids: [3146908044, 3146908063, 3146908089, 3157426258]
    title: Release Notes and its dated children (April/May/June 2025)
    reason: >-
      Dated changelogs, not training material. They also age badly: a 2025
      release note cited in a 2026 deck reads as a stale deck.
  - id: 3146973270
    title: Managing Mobile Worker PersonalID Account Links on CommCare HQ
    reason: >-
      CommCare HQ administration, not Connect usage. Out of scope for FLW and
      LLO training audiences.

# Known naming drift in the source, recorded so deck prose does not copy it
# blindly. ACE's own API field is still `verification_flags`.
naming_notes:
  - note: >-
      The wiki titles the concept "Verification Rules (previously Verification
      Flags)". Connect is mid-rename. Deck prose should follow whatever the
      opportunity's own UI shows the LLO; do not silently adopt either name.
  - note: >-
      "ConnectID" and "PersonalID" both appear in the space, mid-rename. Prefer
      the term the FLW will actually see on their device for the run in
      question.

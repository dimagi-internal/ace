# Connect public help site — curated page map for training decks.
#
# WHAT THIS IS FOR
# ----------------
# The connectpublic wiki is an ADDITIVE source. ACE keeps deriving deck
# content from the PDD, the built app structure and per-run screenshots
# exactly as before; this map supplies SUPPLEMENTARY depth plus outbound
# links an LLO can follow after the session. It is never a substitute for
# run-specific content, and a slide must still stand on its own if the
# reader never clicks a link.
#
# WHY A COMMITTED MAP RATHER THAN PER-RUN LINK CHOICE
# ---------------------------------------------------
# Every run linking the same page for the same topic is worth more than a
# freshly-reasoned choice each time, and a committed list is the only form a
# liveness check can run against. Deck generators MUST cite from this file
# and MUST NOT invent wiki URLs — a fabricated link 404s in front of an LLO,
# which is worse than no link at all.
#
# PROVENANCE
# ----------
# Page ids and paths below were read from the space's own content API
# (`/wiki/rest/api/content?spaceKey=connectpublic`) on 2026-09-09, not
# hand-assembled. Re-derive with `npx tsx scripts/probe-connect-wiki-map.ts`,
# which also checks every url still resolves.
#
# ADDING AN ENTRY
# ---------------
# Append under the matching `sections` key. `id` must be the real Confluence
# page id and `url` must be `base` + the API's `_links.webui` value verbatim.
# Do not shorten, prettify or guess a slug — the numeric id is what makes the
# URL stable across page renames.

base: https://dimagi.atlassian.net/wiki
space_key: connectpublic
verified_on: "2026-09-09"

# Topic -> wiki pages. Keys are stable topic slugs a deck generator can look
# up; they are deliberately NOT slide ids, because slide composition varies
# per archetype while these topics do not.

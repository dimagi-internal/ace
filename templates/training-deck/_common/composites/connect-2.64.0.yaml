# Composited common-pool frames for Connect 2.64.0 (dimagi-internal/ace#3060).
#
# ILLUSTRATION ONLY. Each frame starts from a real 2.64.0 capture (pinned by
# sha256) and replaces only the opp-specific strings, at the bounds the capture's
# own UI dump gives. Every other pixel is the device's. Rules + rationale:
# lib/screenshot-composite.ts. Renderer: scripts/composite-pool-frame.ts.
#
# Replacement strings fill the SAME number of lines as the originals (two-line
# titles, a six-line description): the compositor never moves pixels, so a
# shorter string would leave a gap that real reflow would have closed.
#
# font_px / line_px were measured, not guessed: the original line's ink width
# and line pitch, matched against this exact font file (2026-10-16).
#
# Coverage is enforced: every text element in the dump must match a `keep` rule
# (generic chrome; `text` is a whole-string regex) or a `replace` rule. Anything
# else makes the render refuse, so an APK upgrade that adds a string cannot leak
# it into the pool unreviewed.
#
# Base captures were taken 2026-10-16 on emulator-5554 (versionName 2.64.0,
# versionCode 490738) as test worker worker-1. They show real run names, so they
# live only in Drive at ACE/_common/connect-screenshots/2.64.0/_base/ and never in
# this repo.

apk_version: "2.64.0"
font:
  source: "/system/fonts/Roboto-Regular.ttf on the capture device (Android 14 variable Roboto; CommCare bundles no fonts)"
  sha256: "9ca9debb09459bf4e3e7f826f5cd0f35f253902b85684921fce2ba3f28dd0f50"

frames:
  connect-home:
    base: { recipe: "00-connect-home.yaml", step: "connect-home", sha256: "06c7b116ad189b6f0f7c186081dc9c73f907b51f14fc96008beadb7ccef4c6c7" }
    keep:
      - { id: "", text: "Connect" }
      - { id: tv_error_message, text: "Last synced: .*" }
      - { id: tv_section_header, text: "In Progress|New Opportunities|Completed" }
      - { id: tvDate, text: "Task (ends|ended) on .*" }
      - { id: btn_resume, text: "Resume" }
      - { id: btn_view_info, text: "View Info" }
      - { id: tv_progress_percent, text: "\\d+ %" }
    replace:
      - id: tvTitle
        text:
          - "Sample Opportunity A · Household Visit Program"
          - "Sample Opportunity B · Community Training Program"
          - "Sample Opportunity C · Market Survey Program"
          - "Sample Opportunity D · Follow-Up Visit Program"
        font_px: 37
        weight: 700
        line_px: 56

  claim-opp:
    base: { recipe: "01-claim-opp.yaml", step: "claim-opp", sha256: "f511aec2f5a0cc5f96aba3f7b9688ec4e60a7d2b3e8da9d33b10ffbccd082ff9" }
    keep:
      - { id: "", text: "Connect|Learn Details|Complete the following learn modules and assessment to earn a certificate" }
      - { id: tv_end_date, text: "Complete Project by .*" }
      - { id: btn_start, text: "Start" }
      - { id: connect_delivery_title, text: "Delivery Details" }
      - { id: connect_delivery_subtitle, text: "Once you have completed the learning assessment, you will transition to delivery" }
      - { id: connect_delivery_total_visits_text, text: "\\d+ maximum Visits" }
      - { id: connect_delivery_days_text, text: "\\d+ Days to complete" }
      - { id: connect_delivery_max_daily_text, text: "Maximum visits per day \\d+" }
    replace:
      - id: tv_job_title
        index: 0
        text: "Sample Opportunity · Household Visit Program"
        font_px: 59
        weight: 700
        line_px: 69
      - id: tv_job_description
        index: 0
        text: "The opportunity's description appears here. It explains the work you will do, the area you will work in, and who you will visit. It also says what counts as a completed visit, how each completed visit is checked, and how you are paid for it. Read it carefully before you tap Start, because starting the opportunity is how you accept the work and begin the Learn modules."
        font_px: 32
        weight: 400
        line_px: 38
      - id: tv_learn_modules_list
        index: 0
        text: "1. Introduction to the Work\n\n2. How to Do a Visit\n\n3. Consent and Respect\n\n4. What Counts as a Visit\n\n5. Assessment"
        font_px: 34
        weight: 400
        line_px: 40

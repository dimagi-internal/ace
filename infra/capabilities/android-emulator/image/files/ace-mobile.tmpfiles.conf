# /run/ace-mobile, recreated on every boot (tmpfs).
#   ubuntu (the runner) writes: ready, active-state, launch-timings, boot-path,
#     baseline.json, crashed.
#   root (the boot hook, SSM execs) writes: requested-state, lease.json,
#     idle.json, ready.json, last-activity, record/.
# exec/ holds one file per in-flight `ace-mobile` exec, from root (SSM) and
# ubuntu alike, so it is world-writable and sticky; the idle watchdog reads it.
d /run/ace-mobile      0755 ubuntu ubuntu -
d /run/ace-mobile/exec 1777 root   root   -

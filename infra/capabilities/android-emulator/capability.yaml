# ACE's `android-emulator` capability: one ephemeral EC2 machine per lease,
# booted from ACE's image, driven through canopy-web, terminated on release.
#
# Schema: canopy_runtime.schema.CapabilityManifest, version 1. Contract:
# canopy-web docs/superpowers/specs/2026-10-14-cloud-capabilities-design.md
# §1-§2. Declared in runtime.yaml `capabilities:` and published by deploy.sh
# (`canopy-runtime publish-capabilities --spec runtime.yaml --agent ace`).
#
# `params.state.enum` must equal the states the image bakes: one `cc-<version>`
# per entry of `commcare_versions` in image/variables.pkr.hcl, written to
# /opt/ace/states.yaml by image/scripts/50-states.sh, and the default is that
# list's first entry. test/infra/android-emulator-capability.test.ts fails CI
# when the two drift; bake.sh and deploy.sh also refuse an AMI whose `ace:states`
# tag differs from this enum.
#
# `limits` are mirrored as constants in image/cli/ace_mobile.py (the boot hook's
# max-lifetime halt, ready budget and idle backstop); the same test holds them
# equal.
version: 1
name: android-emulator
kind: ec2-ephemeral
description: Android 14 emulator with CommCare + Maestro, driven by the ace-mobile CLI.
aws:
  region: us-east-1
  stack: canopy-cap-ace-android-emulator
limits:
  max_concurrent: 4
  max_lease_s: 14400
  idle_release_s: 900
  ready_timeout_s: 900
params:
  state: {type: string, default: cc-2.64.0, enum: [cc-2.64.0, cc-2.62.0]}
exec:
  allow: [ace-mobile]

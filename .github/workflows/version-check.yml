name: Version bump check

on:
  pull_request:
    branches: [main]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION was bumped
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Compare against the PR's captured base commit, NOT floating origin/main.
          # Using origin/main causes a race: if main advances (e.g. another PR merges,
          # or this PR itself merges) between when the workflow is queued and when it
          # executes, MAIN_VERSION sees the post-merge value and the check fails
          # spuriously. base.sha is fixed at PR-open / synchronize time.
          PR_VERSION=$(cat VERSION | tr -d '[:space:]')
          BASE_VERSION=$(git show "$BASE_SHA:VERSION" | tr -d '[:space:]')

          echo "PR version:   $PR_VERSION"
          echo "Base version: $BASE_VERSION (from $BASE_SHA)"

          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo ""
            echo "::error::VERSION file was not bumped. Update VERSION before merging."
            echo ""
            echo "Base version: $BASE_VERSION"
            echo "Bump to the next patch/minor/major as appropriate."
            exit 1
          fi

          # Verify it's a valid semver and actually higher than base
          IFS='.' read -r pr_major pr_minor pr_patch <<< "$PR_VERSION"
          IFS='.' read -r base_major base_minor base_patch <<< "$BASE_VERSION"

          if [ "$pr_major" -lt "$base_major" ] 2>/dev/null || \
             ([ "$pr_major" -eq "$base_major" ] && [ "$pr_minor" -lt "$base_minor" ]) 2>/dev/null || \
             ([ "$pr_major" -eq "$base_major" ] && [ "$pr_minor" -eq "$base_minor" ] && [ "$pr_patch" -le "$base_patch" ]) 2>/dev/null; then
            echo ""
            echo "::error::VERSION ($PR_VERSION) is not higher than base ($BASE_VERSION)."
            exit 1
          fi

          echo ""
          echo "✓ Version bump verified: $BASE_VERSION → $PR_VERSION"

      - name: Check ALL version files agree with VERSION
        run: |
          # FOUR files carry the same version and must move together. They are
          # the exact set `scripts/version-bump.sh` writes — that script is the
          # sanctioned way to bump, and this gate is what catches a hand-edit
          # that skipped it.
          #
          #   VERSION            → this gate, /ace:update's upgrade check
          #   plugin.json        → Claude Code's plugin registry: WHAT ACTUALLY
          #                        GETS INSTALLED, and /ace:update's verify step
          #   package.json       → npm tooling, `bin/ace-doctor` consistency check
          #   marketplace.json   → what `/plugin marketplace` resolves
          #
          # History: four consecutive PRs hand-bumped VERSION alone
          # (0.13.666→670) while the others sat at 0.13.667. `/ace:update` read
          # VERSION, correctly reported an upgrade, installed it, then failed its
          # own verification against plugin.json with
          # "MISMATCH: installed v0.13.670 but GitHub has v0.13.667" — a message
          # that reads like a corrupt install. Meanwhile the auto-updater had
          # been resolving the stale 0.13.667 the whole time, so merged fixes
          # never reached a running session (ace#987).
          #
          # The first version of this gate checked only VERSION vs plugin.json
          # and would NOT have caught package.json or marketplace.json drifting
          # — the same bug one file over. Checking all four closes that.
          PR_VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION: $PR_VERSION"

          fail=0
          check() {
            local label="$1" actual="$2"
            printf '  %-34s %s\n' "$label" "$actual"
            if [ "$actual" != "$PR_VERSION" ]; then
              echo "::error::$label ($actual) disagrees with VERSION ($PR_VERSION)."
              fail=1
            fi
          }

          check ".claude-plugin/plugin.json" \
            "$(node -e "console.log(require('./.claude-plugin/plugin.json').version)")"
          check "package.json" \
            "$(node -e "console.log(require('./package.json').version)")"
          check ".claude-plugin/marketplace.json" \
            "$(node -e "
              const m = require('./.claude-plugin/marketplace.json');
              const vs = m.version ? [m.version]
                : (m.plugins || []).map(p => p.version).filter(Boolean);
              const uniq = [...new Set(vs)];
              console.log(uniq.length === 1 ? uniq[0] : JSON.stringify(vs));
            ")"

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Bump every version file in the same commit — use the sanctioned path:"
            echo "    scripts/version-bump.sh"
            echo "Hand-editing VERSION alone is what caused ace#987."
            exit 1
          fi

          echo ""
          echo "✓ All version files agree: $PR_VERSION"

name: Auto version bump

# Bump the PATCH version on every merge to `main`, so a PR never has to.
#
# ## Why
#
# The plugin cache is keyed by version, so two trees under one version means the
# second is on `main` and unreachable by `/ace:update` at the same time
# (ace#1593). Until 0.13.10xx that invariant was defended by a CHECK — every PR
# hand-bumped four files and `check-version-unique.ts` rejected a PR whose
# VERSION `main` already had.
#
# The check was correct and the cost was the problem. VERSION, package.json,
# plugin.json and marketplace.json all change on every PR, and CHANGELOG.md does
# too, so at this repo's merge rate (~9-40 merges/day) every pair of concurrent
# PRs conflicts on five files by construction. One 2026-08-27 session hit SIX
# version collisions in a day and burned a real fraction of itself on the
# disarm -> rebase -> force-push -> re-arm recovery, then added a seventh failure
# mode on top by trusting the worktree instead of HEAD after a clean rebase.
#
# Bumping AFTER the merge satisfies the same invariant by CONSTRUCTION rather
# than by inspection: every merge is followed by exactly one bump, serialized by
# the concurrency group, so no two trees can ever share a version on `main`.
# It also deletes the conflict, because a PR no longer touches the files.
#
# Ported from the hal agent repo, which has run this since 2026-07.
#
# ## Why this lands in two steps, and why the trigger is `workflow_dispatch`
#
# hal's `main` has NO branch protection. ACE's has required status checks
# (`clean-install`) with `enforce_admins: true`, and every commit in its history
# is a PR merge — this repo has never taken a direct push to `main`. So whether
# `github-actions[bot]` can push the bump commit at all is an OPEN QUESTION that
# only a real attempt answers.
#
# Getting it wrong is expensive in the silent direction: if the push is rejected
# while `check-version-unique.ts` has already been relaxed to let non-bumping
# PRs through, two trees land under one version and the second is unreachable by
# `/ace:update` — ace#1593 again, and worse, because nothing would be checking.
#
# So this PR ships the workflow INERT. Run it by hand
# (`gh workflow run "Auto version bump"`), watch the push step, and only then
# ship the second PR, which:
#   - adds `push: { branches: [main] }` here,
#   - makes a bare `scripts/version-bump.sh` a no-op,
#   - relaxes `check-version-unique.ts` for a PR that does not touch VERSION,
#   - rewrites the ship loop in `skills/shipping`.
#
# ## MEASURED 2026-08-27: the push IS rejected. This workflow cannot work as-is.
#
# Run 33072248319 (`workflow_dispatch` on main, VERSION 0.13.1042 -> 0.13.1043).
# The bump computed and committed fine; the push was declined:
#
#     remote: error: GH006: Protected branch update failed for refs/heads/main.
#     remote: - Required status check "clean-install" is expected.
#      ! [remote rejected]   HEAD -> main (protected branch hook declined)
#
# Classic branch protection applies required status checks to DIRECT PUSHES, not
# only to PR merges, and `enforce_admins: true` means no token is exempt — an
# admin PAT is refused identically. There is no in-workflow workaround: the new
# commit cannot have passed `clean-install` before it exists.
#
# **This workflow stays `workflow_dispatch` and stays unused until someone
# decides the settings question.** It is left in the tree rather than deleted
# because it works — the only missing piece is permission, and re-deriving all
# of the above from scratch would cost more than the file does.
#
# ### The decision, for whoever picks it up
#
# The unblocking change is a repository RULESET on `main` listing
# `github-actions` as a bypass actor, alongside the existing classic protection.
# That is narrower than the alternatives: dropping `clean-install` from required
# checks removes the gate for everyone, and `enforce_admins: false` + an admin
# PAT re-opens direct pushes to every admin. It is still a real loosening — one
# actor can put a commit on `main` that `clean-install` never saw — so it is the
# repo owner's call, not a workaround to slip into a workflow.
#
# What it would buy, measured: five files (`VERSION`, `package.json`,
# `plugin.json`, `marketplace.json`, `CHANGELOG.md`) stop changing on every PR,
# which is the entire reason concurrent ACE PRs conflict. Six version collisions
# in one day (2026-08-27) is the number to weigh against it.
#
# ### If the answer is no
#
# Delete this file and `--ci` (keep `--force`). The status quo — every PR bumps,
# `check-version-unique.ts` enforces it, `--rebase-first` recovers the collision
# — is coherent and defends ace#1593 correctly. It just costs the recovery dance
# at this repo's merge rate.
#
# ## Reverting
#
# If this misbehaves: delete this file and restore the `pull_request` arm of
# `scripts/check-version-unique.ts` (it still implements both modes). PRs go
# back to running `scripts/version-bump.sh --force`. Nothing else depends on it.

# MANUAL ONLY in this PR, on purpose. See "Why this lands in two steps" below.
on:
  workflow_dispatch:

permissions:
  contents: write

# Serialized, never cancelled. Two bumps racing would both read the same VERSION
# and write the same next value — reintroducing the collision this exists to end.
concurrency:
  group: auto-version-bump
  cancel-in-progress: false

jobs:
  bump:
    # Skip this workflow's own commit. Belt-and-suspenders: a push made with the
    # default GITHUB_TOKEN does not retrigger workflows anyway.
    if: ${{ !contains(github.event.head_commit.message, '[skip bump]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump patch version across all four files
        run: bash scripts/version-bump.sh --ci

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No version change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json .claude-plugin/plugin.json .claude-plugin/marketplace.json CHANGELOG.md
          git commit -m "chore: bump to $(cat VERSION) [skip bump]"
          git push origin HEAD:main

name: Clean install + dep check

on:
  pull_request:
    branches: [main]
  # REQUIRED for a merge queue, and inert without one. A queue runs the required
  # checks against the merge GROUP (main + everything ahead of this PR in the
  # queue), on a `refs/heads/gh-readonly-queue/...` ref, and GitHub is explicit
  # that the pull_request run does not count for it:
  #
  #   "You must use the `merge_group` event to trigger your GitHub Actions
  #    workflow when a pull request is added to a merge queue."
  #   "Otherwise, status checks will not be triggered when you add a pull
  #    request to a merge queue. The merge will fail as the required status
  #    check will not be reported."
  #   -- GitHub docs, managing-a-merge-queue
  #
  # `clean-install` is main's ONLY required check, so without this line every
  # enqueued PR would sit waiting for a check that never runs and then time out
  # of the queue. Added ahead of the queue being enabled on purpose: it costs
  # nothing until a queue exists (the event never fires), and it must not be a
  # flag day.
  merge_group:
  push:
    branches: [main]

# Three jobs, run in PARALLEL, joined by `clean-install` at the bottom.
#
# Until 2026-10-04 this was one serial job: ~2m per run, 96s of it the unit
# suite (~197s of test work across 661 files, squeezed onto one small runner).
# Under the merge queue it runs TWICE per PR — once on the PR, once on the
# merge group — so every merge cost ~5 minutes of wall clock for a suite that
# runs in ~19s on a laptop. Sharding the suite four ways and running the
# static checks beside it takes each run to roughly the slowest shard.
#
# `clean-install` is still the ONLY required check on main (classic branch
# protection, context name `clean-install`), so the job of that name is now the
# join. It runs with `if: always()` and fails unless every upstream job
# SUCCEEDED: a required check that reports `skipped` would otherwise read as
# passing, which is the silent-green shape this file exists to prevent.
#
# ## ONE full run per PR, not two (2026-10-04, operator decision)
#
# Under the merge queue the PR run gates nothing the queue run does not
# re-check against main as it stands NOW, so on `pull_request` the heavy work
# (`tsc` and the unit shards) is SKIPPED and only the fast static steps run.
# The full suite runs once, on `merge_group`, and again on `push` to main as
# the post-merge backstop. Cost: a broken PR goes red ~1 minute later, in the
# queue, instead of on the PR.
#
# The PR run is not dropped entirely, because of one assertion only it can
# make: the open-PR VERSION claim (PR_NUMBER is empty on merge_group). The
# queue builds up to 5 groups speculatively (`max_entries_to_build: 5`), so two
# PRs that both bump 1099 -> 1100 can each build against a main still at 1099
# and both pass the queue's origin/main assertion. The claim check is what
# rejects the second one.
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history, all branches) is required by the
      # Live-verified selector-map guard below — it diffs the PR's working
      # tree against `origin/main`, which a shallow (depth-1) checkout
      # would not have a ref for.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 22 LTS. Was '20' until 2026-07-25: undici@8 (a transitive dep of
      # the OCS REST tests) calls webidl.util.markAsUncloneable, which does not
      # exist on Node 20 — five suites died at import with a TypeError. It went
      # unnoticed because CI only ran tsc, never the tests.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # BEFORE npm ci, on purpose. Markers in package.json make `npm ci` fail
      # with a JSON parse error, and markers in vitest.config.ts make the suite
      # exit 1 with no summary — both read as infrastructure noise rather than
      # "someone committed a conflict". This step names the file and the line.
      # Needs nothing but git and grep, so it cannot be broken by the thing it
      # is checking for. test/lib/no-conflict-markers.test.ts is the same check
      # inside the suite; this is the half that survives a broken suite.
      - name: No unresolved conflict markers
        run: npm run check:conflicts

      # `npm ci` wipes node_modules and installs strictly from package-lock.json.
      # `npm ls` then fails non-zero if the installed tree has any package that
      # is missing, extraneous, or invalid versus the declared dependencies in
      # package.json. This is the specific check that catches dropped deps from
      # bad merge-conflict resolution — declared deps lost from package.json
      # while still present in package-lock.json show up as "extraneous"; deps
      # present in package.json but missing from the lockfile fail npm ci itself.
      - name: Clean install from lockfile
        run: npm ci

      - name: Verify declared deps match installed tree
        run: npm ls

      # Catches imports of undeclared packages — the secondary form of the same
      # bug class, where code references a package that never made it into
      # package.json. tsc reports as "Cannot find module".
      - name: Type-check
        if: github.event_name != 'pull_request'
        run: npx tsc --noEmit

      # Mechanical fence for 34 live-device-verified selector rows
      # (mcp/mobile/selectors/*.yaml). Previously only enforced by
      # scripts/hooks/pre-commit — a per-clone opt-in
      # (`git config core.hooksPath scripts/hooks`) trivially bypassed by
      # `--no-verify` — so a PR (including one from the autonomous
      # selector-map-heal skill, designed to auto-merge on green) could
      # silently overwrite or delete a Live-verified row with nothing in
      # CI to stop it. Runs the same check the pre-commit hook runs
      # (scripts/check-selector-map-diff.ts), diffed against
      # `origin/main` (its default base when --staged is not passed).
      - name: Selector map Live-verified guard
        run: npx tsx scripts/check-selector-map-diff.ts

      # VERSION must advance past origin/main's CURRENT tip (ace#1593).
      #
      # This lives in clean-install, not version-check.yml, for one reason:
      # clean-install is the ONLY REQUIRED check on main, so it is the only
      # place an assertion actually blocks a merge. version-check.yml is
      # advisory and never stopped anything.
      #
      # It also asserts a different property. version-check compares against
      # the PR's captured BASE sha - "did I bump relative to where I branched"
      # - which two PRs off one base both satisfy while bumping to the SAME
      # value. This reads origin/main LIVE, which is the only reference that
      # can see a concurrent merge.
      #
      # Why it matters: the plugin cache is keyed by version, so two trees
      # behind one version means the second is on main and unreachable by
      # /ace:update at the same time, with every version file reading correct.
      # Measured 2026-08-24: 4 of ~20 PRs in one sweep collided; 3 needed a
      # follow-up bump purely to become reachable.
      # PR_NUMBER + GH_TOKEN are what the SECOND assertion in that script needs
      # (ace#1776): unique against origin/main is not unique against the other
      # PRs that are also about to merge, and `main` has strict=false so this
      # check is never re-run at merge time. Without these two env vars the
      # claim half no-ops SILENTLY — which is why test/lib/version-uniqueness
      # asserts this wiring rather than trusting it.
      #
      # ALSO on `merge_group`, and that arm is the load-bearing one under a
      # queue (ace#1776). The default mode reads `origin/main`'s VERSION LIVE
      # and compares it to the working tree, so on a merge-group ref it asks
      # exactly the right question: does this group's VERSION advance past main
      # as main stands *now*, after everything the queue already merged? That is
      # the merge-time re-check `strict = false` never gave us.
      #
      # It only closes the class if each merge group holds ONE pull request.
      # Two PRs that both bump 1099 -> 1100 make byte-identical VERSION changes,
      # so grouped together they merge cleanly and the group's VERSION is 1100,
      # which does advance past 1099 and PASSES — then both land and main shows
      # 1100 twice. Set the queue's "maximum pull requests to merge" to 1 and
      # each group is main + one PR, where the second PR's group reads 1100 vs
      # an origin/main already at 1100 and is correctly rejected.
      #
      # PR_NUMBER is empty on merge_group, so the open-PR claim half skips
      # itself with a log line (it already handles an unset PR_NUMBER). The
      # origin/main assertion — the one that matters here — still runs.
      - name: VERSION advances past origin/main
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/check-version-unique.ts

      # Post-merge backstop. Cannot block anything - it runs after the merge -
      # but turns an escaped race into an immediately RED main instead of a
      # silent unreachable release nobody notices for days.
      - name: main actually advanced VERSION
        if: github.event_name == 'push'
        run: npx tsx scripts/check-version-unique.ts --post-merge

  # The unit suite. Added 2026-07-25 after this gap bit twice in one week:
  # #917 (app-hq-settings registry rows) and the journey-learn.yaml
  # manifest entry from #892 both landed RED on main, because the only
  # gates were `npm ci` + `npm ls` + `tsc` — none of which run vitest.
  # The suite is pure unit tests (no network, no device, no live OCS /
  # Connect / labs; those are gated behind *_INTEGRATION env vars and
  # stay excluded here).
  #
  # Sharded four ways (vitest --shard splits by FILE). Four, not more: each
  # shard pays ~10s of checkout + npm ci, and the slowest single file is ~24s,
  # so past four the floor is that file, not the split.
  unit-tests:
    # Skipped on the PR run; see "ONE full run per PR" above.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Unit tests (shard ${{ matrix.shard }}/4)
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # The REQUIRED check. See the note above `jobs:`.
  clean-install:
    if: always()
    needs: [static-checks, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Every upstream job succeeded
        env:
          STATIC: ${{ needs.static-checks.result }}
          UNIT: ${{ needs.unit-tests.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "event=$EVENT static-checks=$STATIC unit-tests=$UNIT"
          [ "$STATIC" = success ] || exit 1
          # unit-tests is skipped BY DESIGN on pull_request, and only there.
          if [ "$EVENT" = pull_request ]; then
            [ "$UNIT" = skipped ] || [ "$UNIT" = success ]
          else
            [ "$UNIT" = success ]
          fi

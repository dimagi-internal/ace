name: Clean install + dep check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  clean-install:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history, all branches) is required by the
      # Live-verified selector-map guard below — it diffs the PR's working
      # tree against `origin/main`, which a shallow (depth-1) checkout
      # would not have a ref for.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 22 LTS. Was '20' until 2026-07-25: undici@8 (a transitive dep of
      # the OCS REST tests) calls webidl.util.markAsUncloneable, which does not
      # exist on Node 20 — five suites died at import with a TypeError. It went
      # unnoticed because CI only ran tsc, never the tests.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` wipes node_modules and installs strictly from package-lock.json.
      # `npm ls` then fails non-zero if the installed tree has any package that
      # is missing, extraneous, or invalid versus the declared dependencies in
      # package.json. This is the specific check that catches dropped deps from
      # bad merge-conflict resolution — declared deps lost from package.json
      # while still present in package-lock.json show up as "extraneous"; deps
      # present in package.json but missing from the lockfile fail npm ci itself.
      - name: Clean install from lockfile
        run: npm ci

      - name: Verify declared deps match installed tree
        run: npm ls

      # Catches imports of undeclared packages — the secondary form of the same
      # bug class, where code references a package that never made it into
      # package.json. tsc reports as "Cannot find module".
      - name: Type-check
        run: npx tsc --noEmit

      # The unit suite. Added 2026-07-25 after this gap bit twice in one week:
      # #917 (app-hq-settings registry rows) and the journey-learn.yaml
      # manifest entry from #892 both landed RED on main, because the only
      # gates were `npm ci` + `npm ls` + `tsc` — none of which run vitest.
      # The suite is pure unit tests (no network, no device, no live OCS /
      # Connect / labs; those are gated behind *_INTEGRATION env vars and
      # stay excluded here), and completes in well under a minute.
      - name: Unit tests
        run: npx vitest run

      # Mechanical fence for 34 live-device-verified selector rows
      # (mcp/mobile/selectors/*.yaml). Previously only enforced by
      # scripts/hooks/pre-commit — a per-clone opt-in
      # (`git config core.hooksPath scripts/hooks`) trivially bypassed by
      # `--no-verify` — so a PR (including one from the autonomous
      # selector-map-heal skill, designed to auto-merge on green) could
      # silently overwrite or delete a Live-verified row with nothing in
      # CI to stop it. Runs the same check the pre-commit hook runs
      # (scripts/check-selector-map-diff.ts), diffed against
      # `origin/main` (its default base when --staged is not passed).
      - name: Selector map Live-verified guard
        run: npx tsx scripts/check-selector-map-diff.ts

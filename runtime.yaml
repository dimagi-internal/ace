# ACE's declarative runtime — what a box needs to run an ACE turn, anywhere.
#
# Read by the canopy reconciler (Agent Runtime Registry): it ensures the
# plugins/tools, writes the env from ACE's Canopy vault, runs the preflight, then
# runs the turn. Names no secret and no vault.
#
# Sibling of echo/runtime.yaml, written 2026-09-05 after a from-scratch cloud
# rebuild showed the box provisioning ACE from hardcoded guesses rather than from
# anything ACE declares. Spec: canopy-web
# docs/superpowers/specs/2026-07-20-agent-runtime-registry-design.md
#
# NOTE ON DUPLICATION, deliberate: `required_plugins` also lives in
# config/agent.json, because THAT is the contract bootstrap_agents.sh and
# `canopy agent doctor` actually read today. This file is the declarative target;
# until the reconciler consumes it, agent.json is the live one. They must agree —
# and the drift between two declarations is exactly what cost a mailbox on
# 2026-09-05 (see the gog_client note below).

version: 1

# ACE runs headless on the cloud runner for /ace:run and /ace:turn. The runner box
# itself has no KVM, so it never hosts an emulator: device walks (Phase 6,
# /ace:qa-deep) lease one through the `android-emulator` capability below, a fresh
# EC2 machine per lease. DDD video capture still wants a laptop. "any" is correct
# here; placement belongs to routing, not to this file.
engine: any

# Cloud capabilities ACE claims through canopy-web (one ephemeral machine per
# lease, booted from ACE's image, terminated on release). Each manifest's IaC —
# stack params, image, deploy/bake/teardown scripts — lives beside it; start at
# infra/capabilities/android-emulator/README.md. Published by that dir's deploy.sh
# (`canopy-runtime publish-capabilities --spec runtime.yaml --agent ace`).
capabilities:
  - manifest: infra/capabilities/android-emulator/capability.yaml
  # The Connect test-worker pool (ace#2955): a `kind: pool` capability, one
  # lease per device session's test worker. Needs canopy-web's pool kind —
  # publish only once that is deployed, or the publish refuses this entry.
  - manifest: infra/capabilities/test-worker/capability.yaml

plugins:
  - name: canopy
    source: https://github.com/dimagi-internal/canopy        # canopy@canopy marketplace
  - name: ace
    source: https://github.com/dimagi-internal/ace           # this repo (ace@ace)
  - name: nova
    source: https://github.com/voidcraft-labs/nova-marketplace  # nova@nova-marketplace
    # NOT optional: Phase 3 (commcare-setup) dispatches
    # nova:nova-architect-autonomous via /nova:autobuild. Without it every
    # /ace:run halts at the app build.

tools:
  - name: claude
  - name: gog
  - name: git
  - name: op
  - name: node        # the five MCP servers run straight from TypeScript via `npx tsx`
  - name: java        # commcare-cli.jar — app-release-qa's install-time CCZ gate
    optional: true
  - name: adb         # local-AVD device walks only; the cloud box leases an emulator instead
    optional: true
  - name: maestro
    optional: true

# TRUE literals only — values that do not vary by environment. Everything that
# varies (base urls, template ids, domains) is a value in ACE's Canopy vault,
# even when it is not sensitive.
env:
  ACE_GMAIL_ACCOUNT: ace@dimagi-ai.com

  # The gog OAuth client — a DECLARED PREFERENCE, not the only valid one. The
  # fleet has TWO interchangeable clients, `canopy` (a laptop `gog login`) and
  # `canopy-web` (canopy-web's "Connect Google mailbox" button); same GCP
  # project, same consent screen, so a token under either reads and sends the
  # same (canopy-web #1112, canopy #745/#748/#753). Nothing reads this literal
  # at call time — `lib/gog-identity.ts` / `bin/ace-gog-client` ask `canopy
  # email client` for whichever client THIS machine actually holds a token
  # under, and fall back to this declared value only when canopy itself can't
  # answer. Do not hard-code this to mean "the only client that works."
  #
  # READ THIS BEFORE CHANGING IT. On 2026-09-05 a cloud rebuild provisioned ACE
  # under a client named `ace`; ACE's own config/agent.json warns against exactly
  # that ("no credentials-ace.json is provisioned, so canopy email / bin/ace-email
  # fail outright" — jjackson/ace#1147). The box had a credentials-ace.json anyway
  # and a token minted 2026-05-01 under that client, which no longer authenticates
  # at all. So ACE's mailbox was dead until the mailbox was reconnected — via the
  # canopy-web "Connect Google mailbox" button (preferred), or the terminal
  # alternative `gog login ace@dimagi-ai.com --client canopy --services
  # gmail,calendar,drive,docs,slides,sheets,forms --force-consent` (a narrower
  # `--services` list REPLACES the grant and drops the other scopes, so always
  # pass the full set).
  #
  # The general rule, learned the same day by breaking echo's mailbox with it: a
  # token is minted FOR a client and works only with that client. This field is
  # ACE's declared intent; which client actually has a live token is a per-machine
  # fact resolved at call time, not something to hand-derive from this line.
  ACE_GMAIL_CLIENT: canopy

# The Claude/AI credential is deliberately NOT here. It is a RUNNER-level login
# owned by the runner environment and shared across every agent + every user who
# fires a turn — the runner daemon injects CLAUDE_CODE_OAUTH_TOKEN when it launches
# claude. The agent brings its identity, not its AI subscription.

# No `secrets:` list: ACE's secrets are declared once, in its Canopy vault on
# canopy-web — see canopy agent-core/agent-runtime.md § One declaration.

# Deliberately NOT here, and not a gap:
#   - ~/.ace/*.json (OCS + Connect Playwright session cookies). Per-machine by
#     design — they are bound to a TLS fingerprint and CSRF rotation, so copying
#     them between boxes is worse than re-login (CLAUDE.md § Auth model). The
#     backends auto-relogin from OCS_USERNAME/PASSWORD and ACE_HQ_USERNAME/PASSWORD
#     in the vault, which is why those are required rather than optional.

preflight:
  - name: claude-present
    run: claude --version
  - name: canopy-pat-present
    run: 'test -n "$CANOPY_WEB_PAT" && echo ok'
    expect: ok
  # The real gate. bin/ace-doctor runs the full liveness sweep (Drive SA, HQ,
  # Nova, OCS, Connect, connect-labs, MCP registration) and exits non-zero only on
  # FAIL, so WARNs on a headless box (no AVD, no Java) do not block a turn.
  - name: ace-doctor
    run: bin/ace-doctor

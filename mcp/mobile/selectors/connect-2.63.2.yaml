  # ── J1-smoke-required selectors not yet reachable (added 2026-05-12) ──
  # J1.yaml references these but they live on Deliver-app surfaces which
  # are downstream of the upstream start_learn_app 500. Best-guess values
  # based on CommCare 2.62.0 standard Deliver form chrome; flagged
  # unverified until a live Deliver run reaches them. NOTE: J1 ALSO
  # depends on `form-question-next` and `form-submit` above, which share
  # the same blocker.

  deliver-start-button:
    type: text
    value: "Start Delivering"
    unverified: true
    purpose: "The button that launches the Deliver app from the post-Learn-completion opp-detail. Best-guess: same label/surface as `opp-detail-start-delivering` (kept as a J1-recipe-named alias for the Deliver-side entry). NOT YET REACHED 2026-05-12 — blocked by upstream 500. When verified, this row may collapse into a pure alias of opp-detail-start-delivering."

  form-question-input:
    type: class
    value: "android.widget.EditText"
    purpose: "Free-text answer EditText in a CommCare form question. Live-verified on CommCare 2.63.2 / ACE_Pixel_API_34 2026-08-14 (dimagi-internal/ace#1299): the answer EditText carries **NO resource-id at all** — the previous `org.odk.collect.android:id/answer_text` guess does not exist on this build, and neither does `org.commcare.dalvik:id/answer_text`. Match by CLASS and position instead. Two live facts that follow: (1) CommCare AUTOFOCUSES the first input of a field-list at form open, `focused=true` with zero taps, so its value can be typed without any tap; (2) the per-question layout order is `label TextView -> optional hint TextView -> EditText`, which is why `tapOn: below: <question label>` selects the HINT and is inert — see form-question-input-order below."

  form-question-input-order:
    type: doc
    value: "label TextView -> optional hint TextView -> EditText"
    purpose: "NOT a selector — the calibrated LAYOUT ORDER of a CommCare form question, recorded so recipe authors stop reaching for `below: <label>`. Live ui-dump, CommCare 2.63.2, field-list with two text inputs (ace#1299): TextView 'Facilitator's full name (as on the register)' [42,617][1038,691]; TextView 'First name and family name.' [42,691][1038,756] (the HINT); EditText '' focused=true [42,756][1038,892]. A question WITHOUT a hint has the EditText directly below its label, which is why the idiom appears to work on some screens and silently fails on others — the failure mode is per-question, not per-form."

  form-choice-dialog-title:
    type: id
    value: "org.commcare.dalvik:id/dialog_title_text"
    purpose: "Title of CommCare's generic CHOICE DIALOG — the component behind both the form-exit confirmation and every repeat juncture. Live-verified CommCare 2.63.2 / ACE_Pixel_API_34 2026-08-14 (dimagi-internal/ace#1007, #1290). Read it to decide WHICH dialog you are on: 'Exit Form?' vs 'Add a new <repeat label>?'. This is the anchor to branch on — the buttons' ids differ between the two, see below."

  form-exit-dialog-button:
    type: id
    value: "org.commcare.dalvik:id/choice_dialog_panel"
    purpose: "Buttons on the FORM-EXIT confirmation ('Exit Form?'). Live-verified CommCare 2.63.2, 2026-08-14 (ace#1290): TWO buttons that SHARE this one id — 'STAY IN FORM' and 'EXIT WITHOUT SAVING' — with NO numeric suffix. Because the id is ambiguous, disambiguate by TEXT, and note the text is CommCare chrome (not app content) so it is stable across apps. This dialog is what a back-press lands on when form-submit did not finalize, which is where the Deliver smoke died on spark-facilitator/20260813-2126."

  form-repeat-juncture-button:
    type: id
    value: "org.commcare.dalvik:id/choice_dialog_panel_2"
    purpose: "The ADD action on a repeat JUNCTURE prompt. Live-verified CommCare 2.63.2, 2026-08-14 (ace#1007): unlike the exit dialog, the juncture's buttons are INDEXED — choice_dialog_panel_1 'GO BACK', _2 'ADD A NEW <REPEAT LABEL>?', _3 'DO NOT ADD'. Prefer the INDEX over the text: _2's label interpolates the repeat's own name (it read 'ADD A NEW NULL?' on a probe form whose repeat had no label), so a text matcher is app-specific and brittle while the index is stable. Bounds on a 1080x2400 portrait: _1 [133,1137][374,1357], _2 [419,1137][660,1467], _3 [705,1137][947,1412]."

  form-repeat-juncture-skip:
    type: id
    value: "org.commcare.dalvik:id/choice_dialog_panel_3"
    purpose: "The 'DO NOT ADD' action on a repeat juncture — the way PAST a repeat without entering it, which is what a smoke walk usually wants. Live-verified CommCare 2.63.2, 2026-08-14 (ace#1007). Tapping it advances to the next question after the repeat; verified live by landing on the following select1."

  form-repeat-juncture-back:
    type: id
    value: "org.commcare.dalvik:id/choice_dialog_panel_1"
    purpose: "The 'GO BACK' action on a repeat juncture. Live-verified CommCare 2.63.2, 2026-08-14 (ace#1007). Returns to the previous question rather than entering the repeat."

  form-date-picker:
    type: class
    value: "android.widget.DatePicker"
    purpose: "Native inline date widget rendered by a CommCare `kind: date` question. Live-verified on CommCare 2.63.2 / ACE_Pixel_API_34 2026-08-14 (dimagi-internal/ace#1081, #1300): bounds [214,1208][865,1765] on a 1080x2400 portrait viewport, inside a field-list group. It has no resource-id; match by class. **A scroll gesture originating inside these bounds is CONSUMED by the picker and spins the date** — measured Aug 14 -> Aug 22 from one centre-origin swipe, with the page not moving. Use `lib/fieldlist-gestures.ts safeScrollOriginX` to pick an origin outside its x-range."

  form-date-picker-container:
    type: id
    value: "android:id/pickers"
    purpose: "The LinearLayout holding the three date NumberPicker columns; shares the DatePicker's bounds. Live-verified CommCare 2.63.2, 2026-08-14 (ace#1081). Useful as a presence check for 'this screen carries an inline date question'."

  form-date-picker-column:
    type: class
    value: "android.widget.NumberPicker"
    purpose: "One spinner column of the native date widget. Live-verified CommCare 2.63.2, 2026-08-14 (ace#1081): THREE columns in display order month/day/year, at [235,1250][403,1723], [445,1250][613,1723], [655,1250][823,1723]. Each is `scrollable=true`, which is exactly why it swallows a swipe aimed at the page (ace#1300)."

  form-date-picker-step-next:
    type: doc
    value: "the Button immediately BELOW each column's numberpicker_input"
    purpose: "How to DRIVE the date picker, live-verified CommCare 2.63.2 / ACE_Pixel_API_34 2026-08-14 (dimagi-internal/ace#1081). Each NumberPicker column renders three children in order: a Button holding the PREVIOUS value, the `numberpicker_input` EditText holding the CURRENT value, and a Button holding the NEXT value. Tapping the lower Button increments that column by EXACTLY ONE — measured with read-back: day Aug 14 -> 15 -> 16 on two separate taps. Day-column bounds on a 1080x2400 portrait: prev [445,1250][613,1423], current [445,1423][613,1549], next [445,1549][613,1723]. Read the result back from `form-date-picker-input`; do NOT assume the tap landed. This is the ONLY calibrated way to set a date — a swipe inside a column also moves it, but by an unpredictable number of steps (a single centre swipe jumped Aug 14 -> 22), which is the ace#1300 hazard, not a drive mechanism. UNVERIFIED: bounds stability across a long tap sequence, and month/year rollover at a boundary — a 20-tap burst destabilised the emulator before it could be measured. For the common `. > today()` case one tap is sufficient, so neither residual is on the critical path."

  form-date-picker-input:
    type: id
    value: "android:id/numberpicker_input"
    purpose: "The EditText inside each date NumberPicker column, holding the CURRENTLY SELECTED value ('Aug', '14', '2026'). Live-verified CommCare 2.63.2, 2026-08-14 (ace#1081). This is the read-back to assert a date against — and the one that proved the silent mutation in ace#1300, since it is the only surface that reports what the picker now holds."

  form-photo-capture:
    type: text
    value: "TAKE PICTURE"
    purpose: "In-form image-capture entry button on a CommCare 2.63.0 photo question — text button 'TAKE PICTURE', NOT a `take_photo_button` resource-id (corrected per jjackson/ace#593 from the malaria-rdt/20260531-0739 deliver-product-photo.png capture). Mirrors `camera-take-photo`. Gallery alternative: 'CHOOSE IMAGE'."

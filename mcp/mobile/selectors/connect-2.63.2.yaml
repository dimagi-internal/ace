  deliver-home-job-card:
    type: id
    value: "org.commcare.dalvik:id/viewJobCard"
    purpose: "Project card widget on the StandardHomeActivity (atlas § 10). NOT A LEARN-VS-DELIVER DIFFERENTIATOR — this row previously claimed 'present in Deliver, absent in Learn' and that is FALSE on 2.63.0. Live-captured on hh-poverty-targeting/20260722-1341: after the opp is claimed the LEARN home also renders viewJobCard, with tv_job_title = the opp name, while the toolbar still read '... — Learn app' (#893). deliver-launch.yaml used it to gate the § 9 Download Delivery gate, so the gate was skipped, the Deliver CCZ never installed, and the form walk entered the Learn Pre-assessment. Safe as a 'we are on SOME StandardHomeActivity' anchor; do NOT use it to decide Learn vs Deliver. The validated Deliver-only anchor is `deliver-home-daily-visits` (the delivery-quota progress row), shipped below in this file — see #893."

  deliver-suite-menu:

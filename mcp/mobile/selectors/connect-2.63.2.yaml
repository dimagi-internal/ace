  # ── Geopoint (GPS) — NOTE, not a selector ──────────────────────
  # CORRECTED 2026-06-03 (jjackson/ace#686). The earlier note here (and
  # the #593 CHANGELOG entry) claimed the RDT Sample "GPS location"
  # question is "a plain EditText / free-text field by design — type a
  # 'lat lon alt accuracy' string." THAT WAS WRONG. The field IS a real
  # CommCare geopoint (`kind:geopoint` in Nova; the form carries the
  # standard `selected-at(gps, 0|1|3)` lat/lon/accuracy calcs). The
  # plain-text-box render the #593/#686 investigation saw came from a
  # STALE / DOWNGRADED build whose XForm bind was `type="xsd:string"`
  # instead of `type="geopoint"`. Nova compiles geopoint correctly today
  # (verified 2026-06-03: a fresh compile of the same app yields
  # `type="geopoint"`). Typing a string into the stale text-box widget is
  # exactly what produced the runtime `Calculation Error … gps_lon … list
  # with only 1 element` (spaces don't survive entry, so `selected-at(gps,
  # 1)` sees 1 token).
  #
  # A CORRECT build renders the native geopoint Capture-button widget,
  # which needs an emulator mock-location fix BEFORE the FLW taps the
  # button. LIVE-CALIBRATED 2026-07-13 (dimagi-internal/ace#861) against
  # hh-poverty-targeting/20260702-1456 Phase 6, ACE_Pixel_API_34,
  # connect-2.63.0: the widget's button renders text "RECORD LOCATION"
  # (android.widget.Button, NO resource-id on the button itself — the
  # earlier best-guess "Capture Location" is absent from the live dump).
  # With a mock fix pre-seeded via `mobile_set_location` (LONGITUDE
  # first), tapping RECORD LOCATION AUTO-CAPTURES — the lat/lon/alt/
  # accuracy readout renders under the button with no separate capture
  # dialog. The corrected recipe walked the full Deliver smoke to pass
  # (evidence: 6-qa-and-training/screenshots/journey-deliver/
  # journey-deliver-gps-captured.{png,xml} on that run). NOTE:
  # `mobile_set_location` is AVD-backend-only (unsupported on the cloud
  # emulator backend — mcp/mobile/client.ts). `app-release-qa` hard-gates
  # the stale-build class (kind:geopoint MUST compile to bind
  # type="geopoint") so runs render the real widget. See
  # `skills/app-test-cases/SKILL.md` Step 3 item 4.5 for the
  # recipe-authoring rule.
  geopoint-record-location:
    type: text
    value: "RECORD LOCATION"
    purpose: "Native CommCare geopoint widget's capture button ('RECORD LOCATION', android.widget.Button, no resource-id on the button). Precondition: mock fix seeded via mobile_set_location (longitude first; AVD-only) — then a single tap auto-captures and the Latitude/Longitude/Altitude/Accuracy readout renders below the button. Live-calibrated 2026-07-13, hh-poverty-targeting/20260702-1456 (#861)."


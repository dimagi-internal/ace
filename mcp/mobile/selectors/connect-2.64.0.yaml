    value: "org.commcare.dalvik:id/action_sync"
    purpose: "Toolbar Sync action on the jobs-list surface. Live-verified 2026-09-06 (2.64.0), 35-connect-home-jobs.xml — Button, content-desc 'Sync', [953,146][1080,272]; its sibling action_bell (content-desc 'Notifications') is at [826,146][953,272]."


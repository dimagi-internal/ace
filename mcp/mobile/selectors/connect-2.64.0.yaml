  opp-list-view-opportunity-button:
    type: id
    value: "org.commcare.dalvik:id/btn_view_opportunity"
    unverified: true
    purpose: "View Opportunity on an UNCLAIMED card. NOT OBSERVED on 2.64.0 — no unclaimed cards were on this device's jobs list; every card carried the In-Progress pair btn_resume + btn_view_info instead. Same precondition as home-new-opportunities."

  opp-list-resume-button:
    type: id
    value: "org.commcare.dalvik:id/btn_resume"
    purpose: "Resume on an In-Progress opportunity card. Live-verified 2026-09-06 (2.64.0), 35-connect-home-jobs.xml — Button text 'Resume'. Tapped: it installed the Deliver CCZ and landed on StandardHomeActivity (37-after-resume.xml)."

  opp-list-view-info:
    type: id
    value: "org.commcare.dalvik:id/btn_view_info"
    purpose: "View Info — the SECONDARY button on an In-Progress card. Live-verified 2026-09-06 (2.64.0), 35-connect-home-jobs.xml. Tapped: it opened the opportunity-detail design_bottom_sheet (36-opp-detail.xml)."

  opp-detail-start:
    type: id
    value: "org.commcare.dalvik:id/btn_start"
    unverified: true
    purpose: "PRE-CLAIM 'Start' on the opp-detail page — fires POST /users/start_learn_app/. NOT OBSERVED on 2.64.0: every opportunity reachable from this test user is already claimed, so the pre-claim variant of opp-detail never rendered. The POST-claim detail sheet WAS walked (36-opp-detail.xml) and carries no btn_start, which is expected, not a regression."

  opp-detail-learn-modules-teaser:
    type: id
    value: "org.commcare.dalvik:id/tv_learn_modules_list"
    unverified: true
    purpose: "Pre-claim Learn-Details preview TextView. NOT OBSERVED on 2.64.0, same precondition as opp-detail-start. Absent from the post-claim sheet, as expected."

# Capture the Connect sync action — the sync icon in the toolbar and
# its post-tap "sync complete" state.
#
# !!! DEFECTIVE AS WRITTEN — dimagi-internal/ace#1832. The alias it
# !!! produces is a BYTE-IDENTICAL COPY of `connect-home`, and not by bad
# !!! luck: `takeScreenshot: "sync-button"` below fires BEFORE the
# !!! `tapOn: action_sync` that would change anything, from a pre-state
# !!! this file's own header declares identical to `00-connect-home.yaml`'s
# !!! post-state. So it captures the same settled screen every time.
# !!!
# !!! Measured 2026-09-06, both Drive ids fetched unauthenticated:
# !!!   connect-home 1nUv5Yw4Z4L3xyXCU9xYZvrQBk9cLZADC
# !!!   sync-button  1BqFXsUju_wFaIDYNsviTInBbOgGMzibp
# !!!   md5 4d1c205591270cc4638b439c3a9981ff (both), 242,393 bytes,
# !!!   1080x2400, `cmp` reports no difference.
# !!!
# !!! The alias is QUARANTINED in
# !!! `skills/common-screenshot-capture/SKILL.md § Coverage table` — the
# !!! pool must not publish it as `source: live`.
# !!!
# !!! REPAIR (needs a device, deliberately NOT done blind): move the
# !!! `takeScreenshot` to AFTER the tap and the settle wait, so it shows a
# !!! sync state rather than the home screen. That changes recipe step
# !!! ORDER, which is device-truth per CLAUDE.md § close the loop — and the
# !!! post-sync frame may STILL be near-identical once the 5s wait has let
# !!! any toast expire, which is exactly the thing only a device can tell
# !!! you. Validate on-device, confirm the new frame differs from
# !!! `connect-home`, then un-quarantine the alias and flip the assertion
# !!! in `test/lib/screenshot-pool-distinctness.test.ts`.
#
# Alias produced: sync-button
# Used by: training-deck-template _common/platform-setup.yaml slide "syncing"
#
# Pre-state: Connect opp list (connect_fragment_jobs_list visible). The
# 00-connect-home recipe lands the AVD on this surface.
#
# Post-state: Same as pre-state. Sync triggers a server pull/push but
# doesn't change navigation.
#
# Selector palette: connect-2.63.0.yaml
appId: org.commcare.dalvik
---
# Confirm we're on Connect home before tapping sync.
- assertVisible:
    id: "org.commcare.dalvik:id/connect_fragment_jobs_list"

# Capture the toolbar+list with the sync icon visible at top-right.
# This is the "anchor" screenshot for the sync-button alias: shows
# the icon in its natural toolbar context.
- takeScreenshot: "sync-button"

# Tap the sync action to trigger an actual sync. The icon is content-desc
# "Sync" and resource-id action_sync. Use the resource-id for stability.
- tapOn:
    id: "org.commcare.dalvik:id/action_sync"

# Sync may surface a brief toast / progress spinner. Allow time to settle.
- waitForAnimationToEnd:
    timeout: 5000

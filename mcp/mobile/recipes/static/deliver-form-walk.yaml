# Walk the 3-level Deliver menu from the Deliver home to the service-delivery
# form's first question. Warm session; `deliver-launch.yaml` must have just
# landed us on the Deliver home (`viewJobCard` visible).
#
# Pre-state: Deliver home (deliver-home-job-card / viewJobCard visible).
# Post-state: the first Deliver form question on screen (nav_btn_next visible);
# the composing journey then answers the question(s) and runs form-submit.yaml.
#
# Nav: Deliver home -> Start -> module list -> tap module row -> form list ->
# tap form row -> form.
#
# MENU ANCHOR RULE (dimagi-internal/ace#1127): every menu wait/scope below goes
# through `${SELECTOR:deliver-suite-menu}`, which is DISPLAY-MODE-AGNOSTIC (it
# accepts the list container `screen_suite_menu_list` OR the grid container
# `grid_menu_grid`). These waits were raw `screen_suite_menu_list` literals
# until #1127, which is exactly why the Deliver leg walled the moment Phase 3
# started applying grid menu display app-wide (#1082/PR #1100). Never
# re-hardcode a single container id here — see the selector-map row and the
# `menu-container anchors` invariant in static-recipe-invariants.test.ts.
#
# SELECTOR RULE (load-bearing — validated live, bednet-spot-check/20260602-1345
# deliver leg PASS, ace 0.13.533): tap CommCare menu-list rows by
# `id: org.commcare.dalvik:id/row_txt`, NOT `text: "<row label>"`. A bare
# `text:` match hits the non-clickable action-bar title (which carries the same
# label) FIRST in Maestro's document order, so the tap is a no-op. The
# name-scoped branches below therefore ALWAYS scope their text match with
# `below: id: ${SELECTOR:deliver-suite-menu}` (the list body), which is the
# same body-scoping learn-tap-module.yaml Branches B/C made load-bearing after
# jjackson/ace#590 — an unscoped `text:` match resolves to the toolbar title
# and the row never opens.
#
# ── MODULE_NAME / FORM_NAME SCOPING (dimagi-internal/ace#1138) ──────────────
#
# Parameters (BOTH OPTIONAL — omit both for the legacy single-module behavior):
#   ${MODULE_NAME} — visible label of the MODULE row to tap in the module list
#                    (e.g. "Community Meeting Record").
#   ${FORM_NAME}   — visible label of the FORM row inside that module, when it
#                    DIFFERS from ${MODULE_NAME}.
#
# WHY THIS EXISTS. This recipe used to tap the FIRST `row_txt` row at each of
# the two menu levels, on the stated assumption that "the deliver smoke is one
# module / one form by construction". That assumption is FALSE for every ACE
# Deliver app that registers an entity and then files repeat visits against it,
# because ONE FORM PER MODULE IS A DELIBERATE, LOAD-BEARING ACE PATTERN:
# Connect dedups deliver units by module slug (`get_or_create(DeliverApp,
# slug)`), so two forms in one module collapse into a single DeliverUnit. A
# registration form plus a payable followup is therefore multi-module BY
# CONSTRUCTION. Live case: Deliver app 657a4bb7-fb2f-4a10-af43-8414707b2c43
# (spark-facilitator/20260731-0656) has modules `CBF Registration` and
# `Community Meeting Record`; the positional walk entered CBF Registration and
# never reached the payable form, so `app-test-cases` could not author
# `journey-deliver.yaml` at all.
#
# BACK-COMPAT. When neither name is bound, Maestro substitutes the empty
# string; `text: ""` matches NO node (the same semantics learn-tap-module.yaml
# Branch C already relies on), so every name-scoped guard below evaluates
# false and the positional fallback fires — byte-for-byte the legacy behavior
# for existing single-module callers.
#
# KNOWN CAVEAT (deliberate, matches the Learn side's risk profile): if
# ${MODULE_NAME} IS bound but its row is scrolled out of the viewport, the
# name guard is false and the positional fallback taps row 1 — i.e. the wrong
# module, silently. ACE Deliver apps have 2-3 modules, all on one screen, so
# this is not reachable today; the terminal `${SELECTOR:form-nav-next}` wait
# still fails loud if the walk lands somewhere that is not a form. If a
# Deliver app ever grows a scrolling module list, add a scroll-into-view step
# ahead of the Level-1 branch rather than widening the fallback.
#
# FOLLOWUP FORMS (ace#1138 Gap 2 — CLOSED 2026-08-01). A form registered as a
# `followup` on a case type renders CommCare's EntitySelectActivity case list
# BETWEEN the form row and the first question. This recipe now hands that
# screen to `deliver-case-select.yaml` (Level 3 below), so a followup walks
# through to its first question like any other form.
#
# Two things the caller still owns:
#   ${CASE_NAME} — REQUIRED when the target form is a followup. It is read by
#                  deliver-case-select.yaml via variable inheritance, NOT
#                  re-declared here. Omit it on a followup and the case tap
#                  matches nothing, and the terminal `form-nav-next` wait
#                  fails loud on the case list.
#   Ordering    — the case must already EXIST, which means walking the
#                 registration module's form first. See
#                 skills/app-test-cases/SKILL.md
#                 § Registration-then-followup Deliver apps.
appId: org.commcare.dalvik
---
- takeScreenshot: "deliver-form-walk-home"

# Enter the Deliver app's module suite.
- tapOn:
    text: "Start"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "${SELECTOR:deliver-suite-menu}"
    timeout: 15000
- takeScreenshot: "deliver-form-walk-module-list"

# ── LEVEL 1: module row ────────────────────────────────────────────────────
# Named branch. Body-scoped so the tap lands on the tappable row, not the
# toolbar title that carries the same label (ace#590).
- runFlow:
    when:
      visible:
        text: "${MODULE_NAME}"
        below:
          id: "${SELECTOR:deliver-suite-menu}"
    commands:
      - takeScreenshot: "deliver-form-walk-module-row-${MODULE_NAME}"
      - tapOn:
          text: "${MODULE_NAME}"
          below:
            id: "${SELECTOR:deliver-suite-menu}"

# Positional fallback — fires only when ${MODULE_NAME} named nothing in the
# list body (unbound, i.e. the legacy single-module call). See BACK-COMPAT.
#
# The `visible: deliver-suite-menu` half of this guard is LOAD-BEARING and was
# added after a live failure on 2026-08-01 (ace#1138 Gap 2 validation,
# spark-facilitator/20260731-0656). Without it the two Level-1 branches are a
# bare `visible` / `notVisible` pair on the SAME predicate, evaluated in
# sequence — so the moment the named branch above TAPS AND NAVIGATES AWAY, the
# module row is no longer below the menu and this guard flips TRUE. The
# fallback then fired on the case list and died on `Element not found:
# row_txt`. It went unnoticed on a registration module only because there the
# form list still rendered a row carrying the module's own name (form name ==
# module name), holding the guard false by luck.
#
# Requiring the menu container to still be on screen is what makes the two
# branches mutually exclusive in practice: a successful named tap leaves the
# MenuActivity entirely (for a followup, to EntitySelectActivity), so this
# cannot fire after it. Same lesson `connect-resume-opp.yaml` already encodes
# — see its "guards POSITIVELY, not on btn_resume absence" invariant.
- runFlow:
    when:
      visible:
        id: "${SELECTOR:deliver-suite-menu}"
      notVisible:
        text: "${MODULE_NAME}"
        below:
          id: "${SELECTOR:deliver-suite-menu}"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/row_txt"

- waitForAnimationToEnd:
    timeout: 5000

# ── LEVEL 1.5 (followup modules only): the case list ───────────────────────
# CommCare collects the CASE BEFORE THE FORM. A module whose forms are
# followups on a case type goes straight from the module row to
# EntitySelectActivity — the form list comes AFTER the case is chosen:
#
#   module row -> case list -> case detail -> CONTINUE -> form list -> form
#
# So this handoff MUST sit between Level 1 and Level 2, not after them.
# Live-established 2026-08-01 (ace#1138 Gap 2 validation): with it placed after
# Level 2 the walk selected the case correctly and then stalled on the
# untapped form list, because Level 2 had already run and skipped (the menu
# container is not on screen while the case list is).
#
# ${CASE_NAME} is inherited from this recipe's own caller (Maestro subflows see
# the parent's variables). Guarded on the case list actually being present, so
# a registration / non-case module is unaffected: the guard is false and this
# is a no-op — live-confirmed on the CBF Registration walk the same day.
- runFlow:
    when:
      visible:
        id: "${SELECTOR:case-list-container}"
    commands:
      - runFlow:
          file: deliver-case-select.yaml
      - waitForAnimationToEnd:
          timeout: 5000

# ── LEVEL 2: form row ──────────────────────────────────────────────────────
# Each branch re-guards on "still on the menu AND not already in a form", so
# whichever branch fires first navigates away and the rest are skipped.
#
# CommCare's auto-skip: when a module holds exactly ONE form whose display name
# DIFFERS from the module name, CommCare suppresses the intermediate one-row
# form list and launches the form directly — so after Level 1 we may ALREADY
# be on FormEntryActivity. The `notVisible: form-nav-next` guard makes every
# Level-2 branch a no-op in that case (same contract as learn-tap-module.yaml).

# 2a — named form row (form name differs from module name).
- runFlow:
    when:
      visible:
        id: "${SELECTOR:deliver-suite-menu}"
      notVisible:
        id: "${SELECTOR:form-nav-next}"
    commands:
      - takeScreenshot: "deliver-form-walk-form-list"
      - runFlow:
          when:
            visible:
              text: "${FORM_NAME}"
              below:
                id: "${SELECTOR:deliver-suite-menu}"
          commands:
            - tapOn:
                text: "${FORM_NAME}"
                below:
                  id: "${SELECTOR:deliver-suite-menu}"
            - waitForAnimationToEnd:
                timeout: 5000

# 2b — same-name case: the module's single form shares the module's label, so
# CommCare did NOT auto-skip and the one-row form list shows ${MODULE_NAME}.
- runFlow:
    when:
      visible:
        id: "${SELECTOR:deliver-suite-menu}"
      notVisible:
        id: "${SELECTOR:form-nav-next}"
    commands:
      - runFlow:
          when:
            visible:
              text: "${MODULE_NAME}"
              below:
                id: "${SELECTOR:deliver-suite-menu}"
          commands:
            - tapOn:
                text: "${MODULE_NAME}"
                below:
                  id: "${SELECTOR:deliver-suite-menu}"
            - waitForAnimationToEnd:
                timeout: 5000

# 2c — positional fallback. Nested notVisible guards so this fires ONLY when
# NEITHER name is present in the list body (Maestro's `when:` takes at most one
# `visible:` and one `notVisible:`, so "neither" has to nest).
- runFlow:
    when:
      visible:
        id: "${SELECTOR:deliver-suite-menu}"
      notVisible:
        id: "${SELECTOR:form-nav-next}"
    commands:
      - runFlow:
          when:
            notVisible:
              text: "${FORM_NAME}"
              below:
                id: "${SELECTOR:deliver-suite-menu}"
          commands:
            - runFlow:
                when:
                  notVisible:
                    text: "${MODULE_NAME}"
                    below:
                      id: "${SELECTOR:deliver-suite-menu}"
                commands:
                  - tapOn:
                      id: "org.commcare.dalvik:id/row_txt"
                  - waitForAnimationToEnd:
                      timeout: 5000

# Form's first question is on screen once the form-nav bar renders.
- extendedWaitUntil:
    visible:
      id: "${SELECTOR:form-nav-next}"
    timeout: 15000
- takeScreenshot: "deliver-form-walk-form-question"

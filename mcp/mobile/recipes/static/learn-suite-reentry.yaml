# Re-enter the Learn-app suite menu from StandardHomeActivity between
# modules. Tap the Start tile, wait for `screen_suite_menu_list`.
#
# WHY THIS EXISTS (jjackson/ace#646)
# ----------------------------------
# A Learn form (content OR quiz) finalizes back to **StandardHomeActivity**
# (the CommCare app home: Start / View Job Status / Sync / Log out tiles,
# "1 form sent to server!" subtext) — NOT to the suite menu list. So after
# finishing one module's form, the device is on the home grid, NOT on
# `screen_suite_menu_list`. The next `learn-tap-module` asserts
# `screen_suite_menu_list is visible` as its pre-state and hard-fails if
# called directly from the home grid.
#
# This recipe is the explicit "tap Start → wait suite menu" re-entry the
# journey recipe runs between every module (after `content-form-finish`
# / `form-submit` for module N, before `learn-tap-module` for module N+1).
#
# SCOPE — this is the `post_submit: module` HALF OF A PAIR. The paragraph
# above is true only when the form finalizes to the home grid. Nova's DEFAULT
# is `post_submit: previous`, which finalizes to the module's own form list;
# there this recipe's 30s wait on the home "Start" tile never fires and the
# walk hangs after form 1 (dimagi-internal/ace#1071). Read `post_submit` off
# the blueprint and compose the matching PAIR — the finalize half branches on
# the same field (dimagi-internal/ace#1566):
#
#   post_submit: module    -> content-form-finish          + this recipe
#   post_submit: previous  -> content-form-finish-to-suite + learn-suite-reentry-from-module
#   single-module app      -> content-form-finish-to-suite + no re-entry (ace#894)
#
# Identical surface contract to `learn-launch.yaml` (which is the FIRST
# suite entry, post-claim). Split out as its own named primitive so the
# journey template reads as a clean per-module loop:
#   learn-tap-module → content-form-finish → learn-suite-reentry → (next)
# rather than re-purposing the post-claim launch recipe mid-walk. Both
# share the same pre/post state (home grid → suite menu), so either works;
# the distinct name documents the between-modules intent at the call site.
#
# CONTRACT
# --------
# Pre-state: StandardHomeActivity home (`learn-home-start-tile` /
#   text "Start" visible). This is the post-state of `content-form-finish`
#   and of any Learn form finalize.
# Post-state: MenuActivity showing the menu container (the suite root,
#   with one tappable row per module).
#
# MENU ANCHOR RULE (dimagi-internal/ace#1127): the post-state wait uses
# `${SELECTOR:learn-suite-menu}`, which accepts the LIST container
# (`screen_suite_menu_list`) OR the GRID container (`grid_menu_grid`).
# Prose below that names `screen_suite_menu_list` describes the original
# list-mode incident; the anchor itself must stay display-mode-agnostic.
#
# ${REENTRY_LABEL} — REQUIRED AT EVERY CALL SITE (ace#2182). A per-INVOCATION
# suffix on this palette's otherwise-fixed capture names, the same shape as
# `deliver-form-walk.yaml`'s ${WALK_LABEL}. A multi-module Learn walk calls
# this palette once per module boundary (18 times on
# poverty-graduation/20260905-1345); with a fixed name every call OVERWRITES
# the last and one frame survives. Bind a distinct `[a-z0-9-]` slug with its
# leading separator, e.g. `REENTRY_LABEL: "-m2"`. No `env:` default here: a
# subflow's `env:` OVERRIDES the caller's (ace#1033), and an unbound var
# renders as the literal `undefined` (ace#1668) — the lint's
# `runFlow-unbound-screenshot-name` rule rejects an unbound call site, and
# `repeat-palette-invocation-without-discriminator` rejects a repeated value.
appId: org.commcare.dalvik
---
- extendedWaitUntil:
    visible:
      ${SELECTOR:learn-home-start-tile}
    timeout: 30000
- takeScreenshot: "learn-suite-reentry-home-tiles${REENTRY_LABEL}"

# Tap the green Start tile. Maestro walks up from the `card_text`
# TextView to the clickable `card` RelativeLayout.
- tapOn:
    ${SELECTOR:learn-home-start-tile}

# Land back on the suite root menu so the next `learn-tap-module` can
# drill the next module.
- extendedWaitUntil:
    visible:
      id: "${SELECTOR:learn-suite-menu}"
    timeout: 15000
- takeScreenshot: "learn-suite-reentry-suite-root${REENTRY_LABEL}"

# Navigate Connect's opp list to the target opp's In-Progress card and
# tap its CTA (Resume OR Proceed), landing on the post-Learn
# certificate/opp-detail surface (atlas § 8) that deliver-launch.yaml consumes.
#
# Pre-state: Connect opp-list (connect_fragment_jobs_list) visible;
# the target opp is in the "In Progress" section. Warm-session only —
# assumes the journey-learn leg just completed Learn in this dispatch.
#
# Post-state: the certificate/opp-detail surface (atlas § 8):
# either the "Congratulations" certificate overlay or the
# connect_learning_button ("VIEW OPPORTUNITY DETAILS") on the opp-detail
# screen — whichever Connect renders after the CTA tap. deliver-launch.yaml
# handles both variants and drives forward from here.
#
# EXPECTED DUPLICATE (ace#869): `connect-resume-opp-list-synced` and
# `connect-resume-opp-tile` observe the SAME frame whenever the target tile
# is already in the viewport, because the scrollUntilVisible between them is
# then a no-op. This is not fixable in Maestro — there is no way to branch on
# "did the scroll actually move". Both shots are kept deliberately: each is a
# top-level step, so each is its own UI-dump window, and dropping either
# loses a window. The manifest `duplicate_of` dedup (app-screenshot-capture
# SKILL Step 5.5) is the permanent handling — downstream consumers already
# treat a duplicate_of pair as one moment.
#
# Required env vars (pass via mobile_run_recipe.envVars):
#   OPP_RUN_ID — the run-id (YYYYMMDD-HHMM) of the current run; the
#                recipe anchors the target-tile match on this short,
#                line-1, unique token (see
#                skills/app-screenshot-capture/SKILL.md § OPP_RUN_ID
#                matcher). Phase 4 `connect-opp-setup` front-prefixes the
#                opp name with this run-id (`"<run_id> · <display>"`), so
#                it lands on the tile's first line and never clips —
#                making the resume deterministic among the test user's
#                accumulated invites. The recipe matches it as
#                `text: ".*${OPP_RUN_ID}.*"` (Maestro `text:` is a
#                FULL-match regex; the `.*` wrappers substring-match the
#                run-id within the longer tile label). Same contract as
#                connect-claim-opp.yaml. Pass verbatim from
#                `run_state.yaml.run_id`.
#   OPP_NAME   — display name of the opportunity (verbatim from
#                run_state.yaml.phases.connect-setup.products.connect.opportunity.name).
#                Retained for screenshots / logging context ONLY — it is
#                NOT the matcher anymore (the matcher is OPP_RUN_ID).
#
# SELECTOR STATUS — card list dump-confirmed live on ACE_Pixel_API_34,
# CommCare 2.63.0, 2026-05-31 (jjackson/ace#591):
#   - Each opp tile is one `rootCardView`; its inner (unnamed) ViewGroup
#     holds `tvTitle` + the CTA button (`btn_resume`) + `btn_view_info` as
#     SIBLING direct children. (The secondary button is `btn_view_info`,
#     NOT `btn_view_opportunity`.)
#   - A Learn-IN-PROGRESS card shows `btn_resume` (text "Resume").
#   - A Learn-100%-COMPLETE card shows a "Proceed" CTA instead (jjackson/ace#591
#     screenshot evidence). Its resource-id was NOT dump-confirmable this
#     session (no Learn-complete opp on the calibration device), so the
#     Proceed branch matches by its text label — which is fine because the
#     tap is card-scoped (see below) and therefore leak-proof regardless.
#
# WHY card-scoping (the #591 fix): the prior recipe tapped
# `id: btn_resume, below: text: ${OPP_NAME}` — which matches the FIRST
# btn_resume in DOCUMENT ORDER below the title. On a Learn-complete target
# (whose own CTA is "Proceed", not "Resume") this leaked to a LATER tile's
# Resume button and resumed the WRONG opp. The fix scopes every CTA tap to
# the card whose subtree directly contains the run-id token via
# `childOf: { containsChild: { text: ".*${OPP_RUN_ID}.*" } }`. Validated live: this
# selector resolves to exactly the target card's button. `containsChild` is
# DIRECT-child only, which is why it pins to the inner ViewGroup (title +
# button siblings) and not the outer rootCardView/RecyclerView.
appId: org.commcare.dalvik
---
# --- #618 inter-leg handoff (Learn home -> Connect jobs list) — CHARACTERIZED + HEALED (#711)
# The journey-learn leg can leave the device on the CommCare Learn-app home
# (nsv_home_screen / StandardHomeActivity) instead of Connect's jobs list. The
# post-Learn end-state is NONDETERMINISTIC — sometimes the jobs list (the assert
# below passes directly), sometimes the Learn home.
#
# The back-nav was CAPTURED LIVE on ACE_Pixel_API_34 / CommCare 2.63.0
# (bednet-spot-check/20260605-0658, jjackson/ace#711) following the discipline:
# capture → candidate tap → re-dump → confirm. The route: open the top-left
# nav drawer (burger), tap the "Opportunities" row (a list_title TextView inside
# nav_drawer_recycler) → lands on connect_fragment_jobs_list. The prior
# `pressKey: back` dead-end (it exits CommCare to the Android launcher) is NOT
# used.
#
# The heal below is GUARDED on `notVisible: home-jobs-list`, so it no-ops on the
# runs that already landed on the jobs list (the nondeterministic case) and only
# opens the drawer when we're on the Learn home. After it routes (or if already
# landed), the assert confirms the pre-state connect-resume-opp consumes.
# --- #1032 CORRECTION to the #711 heal above -----------------------------
# The #711 route (tap point "73,209" = nav-drawer burger, then the
# "Opportunities" row) is WRONG on the Learn SUITE surface, and the Learn
# suite is a real post-Learn landing. Live-captured 2026-07-28
# (bednet-spot-check/20260728-2222, APK 2.63.2): at "73,209" the Learn
# suite renders the ActionBar "Navigate up" ImageButton, bounds
# [0,63][147,210] — y=209 is ONE PIXEL inside it. So the tap navigates UP
# one suite level instead of opening a drawer, and the follow-up
# `tapOn: "Opportunities"` can never resolve (no such element on either
# the module list or the app root). Confirmed by the title changing
# between the pre-tap and failure dumps: "Connect Basics" -> "Bednet
# Spot-Check Learn app". Result: `selector-not-found`, Deliver leg dead
# 100% of the time on that path.
#
# The correct route, validated live on-device in the same dispatch:
#   BACK #1 -> org.commcare.activities.MenuActivity     (nsv_home_screen)
#   BACK #2 -> org.commcare.activities.DispatchActivity (connect_fragment_jobs_list)
# Dumps: ACE/bednet-spot-check/runs/20260728-2222/6-qa-and-training/
#        screenshots/journey-deliver/pathA-nav-probe-{1,2}-*.xml
#
# Unrolled + guarded rather than `repeat:` — Maestro `repeat` is not in
# ALLOWED_STEP_KEYS (see content-form-finish.yaml). EVERY back is guarded
# on `notVisible: home-jobs-list`, so the sequence self-terminates the
# instant the jobs list appears and cannot overshoot into the "a back
# press exits CommCare" state that #1032 warns about.
#
# --- BACK BUDGET CALIBRATION — three measured landings ------------------
# The bound is 5, and it is a FLOOR sized by the DEEPEST measured landing,
# not an exact figure. Each row below was observed on-device:
#
#   Learn home   -> 1 back   (#711 / #1032, APK 2.63.0 + 2.63.2)
#   Learn suite  -> 2 backs  (#1032, bednet-spot-check/20260728-2222,
#                             APK 2.63.2; dumps pathA-nav-probe-{1,2})
#   Deliver app home / module grid
#                -> 5 backs  (ace#1848, spark-facilitator/20260828-0703,
#                             APK 2.63.2)
#
# The Deliver-side landing is what raised the bound from 3 to 5. It is
# reached on any DELIVER-LEG RE-ENTRY — a retry after a Deliver failure,
# or a resumed run where the device is already inside the Deliver app
# (`StandardHomeActivity`) rather than on Connect's jobs list. Measured
# transcript (ace#1848): three guarded backs left the device on the
# Deliver app's OWN module grid — `grid_menu_grid`, rows "Enrol a
# community" / "Record a community meeting", action bar "Spark FCAP
# Facilitator Deliver app" — and two further backs (MenuActivity, then
# DispatchActivity) reached `connect_fragment_jobs_list`.
#
# WHY EXTRA BACKS CANNOT OVERSHOOT: every step is guarded on
# `notVisible: home-jobs-list`, so the sequence stops the instant the
# jobs list renders and the recipe NEVER presses back FROM the jobs list
# — which is the one surface where a back press exits CommCare to the
# launcher (see the #711 note below). The added steps are therefore inert
# no-ops on the two shorter Learn landings. Empirically confirmed on the
# ace#1848 walk: five backs from the Deliver app reached the jobs list
# WITHOUT exiting CommCare. A landing deeper than 5 still falls through
# to the assert below and fails loud with a named anchor rather than
# silently walking into the launcher.
#
# *Enforced:* `test/mcp/mobile/static-recipe-invariants.test.ts` pins the
# count at 5 AND pins every one of them to the `notVisible home-jobs-list`
# guard — the guard is what makes the count safe, so an unguarded back is
# the real regression.
#
# NOTE on the #711 comment above: it claims a bare `pressKey: back` exits
# CommCare to the Android launcher. That is the behaviour from the jobs
# list itself, which the guard now prevents us ever pressing from — it is
# NOT the behaviour from the Learn suite, the Learn home, or the Deliver
# app home, per the #1032 and ace#1848 captures. If a future landing
# surface does exit early, the final assert names it rather than silently
# walking into the launcher.
- runFlow:
    when:
      notVisible:
        id: "${SELECTOR:home-jobs-list}"
    commands:
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "${SELECTOR:home-jobs-list}"
    commands:
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "${SELECTOR:home-jobs-list}"
    commands:
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "${SELECTOR:home-jobs-list}"
    commands:
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "${SELECTOR:home-jobs-list}"
    commands:
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "${SELECTOR:home-jobs-list}"
    timeout: 15000
    optional: true

# Confirm we are on the opp-list (passes directly when already there, or after
# the #711 heal branch above routes here from the Learn home).
- assertVisible:
    id: "${SELECTOR:home-jobs-list}"

# Sync the jobs list before searching for the target tile (#618). After the
# journey-learn leg completes, the opp's Learn->Deliver-eligible transition may
# not have propagated to the rendered rvJobList, so the just-completed run's
# In-Progress card can be ABSENT from a stale list (bednet-spot-check/20260612-0817
# Deliver leg: scrollUntilVisible timed out — only prior-run opps rendered). An
# in-app sync pulls current state. Same affordance + reasoning as
# connect-claim-opp.yaml's pre-search sync (#628). `optional: true` so a warm
# already-synced surface (or a momentarily re-rendering toolbar) does not abort.
# NOTE: best-effort — authored from the #618 evidence, NOT yet live-validated.
# The next fresh /ace:run Phase 6 Deliver leg is the live confirmation.
- tapOn:
    id: "${SELECTOR:home-toolbar-sync}"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "connect-resume-opp-list-synced"

# Scroll the target opp's In-Progress card into the viewport.
# SCROLL BUDGET (ace#1289) — `speed: 40`, `timeout: 120000`,
# `visibilityPercentage: 30`, matching connect-claim-opp.yaml.
#
# This recipe NEVER received the #647 recalibration: it sat on the
# pre-#647 defaults (`timeout: 20000`, `visibilityPercentage: 60`, no
# explicit speed) through both #647 and #800, so its budget was two
# rounds of tuning behind the sibling recipe it is supposed to mirror.
# That is the actual defect #1289 names — not that the numbers were
# wrong, but that only one of the two tile-finding recipes was ever
# tuned.
#
# `visibilityPercentage` drops 60 → 30 for the same reason it did in the
# claim recipe: a multi-line wrapped title may never present 60% of
# itself in the viewport, so the higher bar can make a VISIBLE tile
# unmatchable. Live-proven budget: see connect-claim-opp.yaml's
# SCROLL BUDGET note (bednet-check-2-visit/20260814-0357).
#
# `centerElement: true` (jjackson/ace#800) — keep the whole card (title +
# CTA button) in the viewport. The card-scoped `childOf containsChild`
# tap guards below need the CTA rendered, not clipped at the viewport
# bottom; centering matches the claim-recipe parity fix.
- scrollUntilVisible:
    element:
      text: ".*${OPP_RUN_ID}.*"
    direction: DOWN
    speed: 40
    timeout: 120000
    visibilityPercentage: 30
    centerElement: true
    # `optional: true` (ace#1289, second clause) — an exhausted budget
    # falls through to the fallback re-hunt below instead of aborting.
    optional: true

# --- FALLBACK RE-HUNT (ace#1289) ----------------------------------------
#
# Same second-budget mechanism as connect-claim-opp.yaml, but WITHOUT a
# section anchor. This recipe's target is an In-Progress card in the FIRST
# section, and NO verified selector exists for that section's header — grep
# `mcp/mobile/selectors/connect-2.64.0.yaml` for `in.progress` /
# `section_header` and the only hits are prose. (First run against
# connect-2.63.2.yaml, now historical; it returned the same nothing, and
# 2.64.0 introduced no id drift anywhere in this map.) Inventing the string
# would be exactly the "guess at a value another system owns" CLAUDE.md forbids,
# so this fallback is a single UP re-hunt on the run-id at the same
# live-proven budget: it recovers the case where the DOWN scroll ran past
# the tile or hit the list end, and nothing more.
#
# `centerElement: true` stays on this scroll — it is the last step to touch
# the viewport before the card-scoped `childOf containsChild` tap guards
# below, which need the CTA rendered, not clipped (#800).
#
# RESIDUAL: depth here stays O(In Progress), which grows one card per
# /ace:run and is unprunable (lib/invite-pruning.ts:88-91 excludes
# accepted invites). Only a doubled budget, not a bounded walk.
- runFlow:
    when:
      notVisible:
        text: ".*${OPP_RUN_ID}.*"
    commands:
      - scrollUntilVisible:
          element:
            text: ".*${OPP_RUN_ID}.*"
          direction: UP
          speed: 40
          timeout: 120000
          visibilityPercentage: 30
          centerElement: true

# Failure stays LOUD.
- assertVisible:
    text: ".*${OPP_RUN_ID}.*"

- takeScreenshot: "connect-resume-opp-tile"

# Tap the target card's CTA, STRICTLY scoped to the card whose subtree
# directly contains the run-id token (`.*${OPP_RUN_ID}.*`). Two label variants depending on Learn
# state; whichever is present in THIS card is tapped. Maestro auto-scrolls
# the tap target into view, so no separate button-scroll step is needed.
#
# Branch A — Learn in progress: the card's CTA is `btn_resume`.
- runFlow:
    when:
      visible:
        id: "${SELECTOR:opp-list-resume-button}"
        childOf:
          containsChild:
            text: ".*${OPP_RUN_ID}.*"
    commands:
      - tapOn:
          id: "${SELECTOR:opp-list-resume-button}"
          childOf:
            containsChild:
              text: ".*${OPP_RUN_ID}.*"
          retryTapIfNoChange: true

# Branch B — Learn complete: the card's CTA is the "Proceed" button
# (resource-id not yet dump-confirmed; matched by label, card-scoped).
# Guard is POSITIVE ("Proceed" present in the target card), NOT
# "btn_resume not visible" — otherwise, after Branch A taps Resume and
# navigates away, a "btn_resume not visible" guard would become true and
# this branch would wrongly fire (caught live 2026-05-31). Only one CTA
# label is present per card, so the two positive guards are mutually
# exclusive, and after either taps + navigates, neither re-fires.
- runFlow:
    when:
      visible:
        text: "Proceed"
        childOf:
          containsChild:
            text: ".*${OPP_RUN_ID}.*"
    commands:
      - tapOn:
          text: "Proceed"
          childOf:
            containsChild:
              text: ".*${OPP_RUN_ID}.*"
          retryTapIfNoChange: true

# FAIL LOUD (#591): a correct CTA tap leaves the jobs list. If we are still
# on connect_fragment_jobs_list, the tap was a no-op or hit the wrong
# surface — halt here with a named failure instead of silently proceeding
# into the wrong opp's app (the exact silent wrong-opp resume #591 reported).
- extendedWaitUntil:
    notVisible:
      id: "${SELECTOR:home-jobs-list}"
    timeout: 10000

# Post-CTA: Connect surfaces either the certificate screen (atlas § 8)
# or the opp-detail screen with connect_learning_button. Both are the
# correct pre-state for deliver-launch.yaml.
- takeScreenshot: "connect-resume-opp-landed"

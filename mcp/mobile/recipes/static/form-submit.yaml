# Submit a form at its final question.
#
# DELIVER FINALIZE IS KNOWN — do not re-file this as unverified.
# Plain (non-score-gated) Deliver forms AUTO-FINALIZE via `nav_btn_next`
# on the last question, exactly as plain Learn forms do (atlas §7). There
# is no explicit Submit button on that path, and finalizing writes the
# form to the LOCAL OUTBOX and returns to the form list — it does NOT
# sync. Observed live on bednet-spot-check/20260729-1239; the full
# transcript, including the "You last synced with the server: never"
# reading that proved it, is recorded in the sibling `deliver-sync.yaml`
# header (dimagi-internal/ace#1066). Server round-trip is that recipe's
# job, not this one's.
#
# The `form-submit` branch below is therefore a defensive no-op on every
# surface walked to date. It is retained because it costs one invisible-
# element check and would catch a future Deliver form that does ship an
# explicit Submit, but its absence is the expected case — not a gap.
#
# This recipe branches:
#   - If a Submit button is visible, tap it (form-submit selector).
#   - Otherwise, tap nav_btn_next — the auto-finalize path that plain
#     (non-score-gated) Learn forms use.
#   - THEN, if a FINISH button is visible (form-nav-finish), tap it —
#     this is the SECOND screen of a score-gated quiz finalize: a
#     single-question quiz with a score-conditional result label does
#     NOT auto-finalize on nav_btn_next; answering advances to a
#     result-label screen whose FINISH button submits + syncs the form.
#     Empirically confirmed on bednet-spot-check/20260529-1124 (#569).
#     Without this press the assessment never submits/syncs and Connect
#     never unlocks Deliver.
#
# Post-state: depends on the form. Learn forms return to
# StandardHomeActivity with a "1 form sent to server!" toast +
# `card_subtext` update. Plain Deliver forms return to the FORM LIST with
# the visit in the local outbox and no toast — chain `deliver-sync.yaml`
# when the leg has to prove the visit reached Connect.
#
# Parameters — BOTH ARE REQUIRED AT EVERY CALL SITE:
#   ${SCREENSHOT_NAME_PRE_SUBMIT} — screenshot before tapping Submit
#                                   (e.g. "deliver-final-review")
#   ${SCREENSHOT_NAME_POST_SUBMIT} — screenshot after submit confirmation
#                                    (e.g. "deliver-submitted-confirmation")
#
# There is deliberately NO `env:` default block here. A Maestro flow's own
# top-level `env:` does NOT act as a default — it OVERRIDES whatever the
# caller passed. Measured against the pinned Maestro 2.5.1 source:
# `MaestroFlowParser.parseFlow` prepends the subflow's `env:` as a
# DefineVariablesCommand INSIDE the subflow body, `YamlFluentCommand.runFlow`
# then prepends the CALLER's env in front of that, and
# `Orchestra.runSubFlow` executes both in list order with an unconditional
# `putEnv` — so the subflow's block writes LAST and wins.
#
# Live corroboration (bednet-spot-check/20260728-2222 Phase 6): the caller
# passed "journey-learn-result" / "journey-learn-submitted" and the files
# that landed were `form-submit-pre.png` / `form-submit-post.png` — the
# defaults this block used to carry. So the ace#852 fix did not merely fail
# to generalize; it silently DEFEATED the per-journey naming it was added to
# enable. Removed in dimagi-internal/ace#1033; the caller is now the only
# source of both names.
#
# Unbound is now caught at authoring time by the
# `runFlow-unbound-screenshot-name` rule in `mcp/mobile/recipe-lint.ts`
# (`mobile_validate_recipe` runs it before Maestro's own parser), because an
# unset placeholder renders as the literal string `undefined` — both shots
# would land on the SAME `undefined.png` and post-submit would overwrite
# pre-submit (the original #852 symptom).
#
# The 2.62.0-era note that this recipe should be "replaced once the atlas
# walks Deliver" is retired: Deliver was walked, the auto-finalize path is
# the answer, and the branch above already encodes it.
appId: org.commcare.dalvik
---
- takeScreenshot: "${SCREENSHOT_NAME_PRE_SUBMIT}"

# Try the explicit Submit button first (covers Deliver-style flows if
# they exist). If not visible, fall through to nav_btn_next
# (Learn-style auto-finalize).
- runFlow:
    when:
      visible:
        ${SELECTOR:form-submit}
    commands:
      - tapOn:
          ${SELECTOR:form-submit}
- runFlow:
    when:
      notVisible:
        ${SELECTOR:form-submit}
    commands:
      - tapOn:
          ${SELECTOR:form-nav-next}

- waitForAnimationToEnd:
    timeout: 8000

# Score-gated quiz: the nav_btn_next above advanced to a result-label
# screen rather than finalizing. If a FINISH button is now visible,
# press it to submit + sync the form. (No-op for plain forms that
# already auto-finalized — the button won't be visible.)
- runFlow:
    when:
      visible:
        ${SELECTOR:form-nav-finish}
    commands:
      # Capture the result label BEFORE pressing FINISH. This screen is the
      # ONLY place a score-gated quiz shows the learner their percentage and
      # whether they certified, and FINISH replaces it — so a walk that goes
      # straight to the tap leaves NO frame of the score anywhere.
      #
      # turmeric-market-study/20260828-1108 shipped exactly that: an FLW guide
      # and a 50-slide deck both captioned the POST_SUBMIT frame as "your
      # certification result", when that frame is the lesson menu with a
      # "1 form sent to server!" toast. The released CCZ carries the labels
      # ("You passed ... scored <user_score> percent" / "You need 80 percent to
      # certify ... try again"), so the app does show it — the recipe never
      # looked.
      #
      # The name derives from ${SCREENSHOT_NAME_PRE_SUBMIT} rather than taking
      # a placeholder of its own, deliberately: PRE_SUBMIT is already REQUIRED
      # at every call site and enforced by the `runFlow-unbound-screenshot-name`
      # lint rule, so this cannot render as literal `undefined` (the ace#852
      # defect this file's header documents) and cannot collide when one
      # dispatch walks two score-gated forms.
      - takeScreenshot: "${SCREENSHOT_NAME_PRE_SUBMIT}-result"
      - tapOn:
          ${SELECTOR:form-nav-finish}
      - extendedWaitUntil:
          visible:
            text: ".*form.*sent to server.*"
          timeout: 15000

- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "${SCREENSHOT_NAME_POST_SUBMIT}"

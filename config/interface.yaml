# What CALLERS may ask ACE for — anyone who is not its owner, a workspace owner,
# or an admin granted on the agent's Overview in canopy-web. Staff emailing from a
# DMARC-aligned address that is a canopy member resolve to their account, so this
# file does NOT confine them unless they are plain members (see canopy-web #891).
#
# NOT IN EFFECT until published — a production policy change, made deliberately:
#     canopy agent interface --slug ace --repo .
# Once published, every other person's turn runs in its own `cx-` session,
# confined by canopy's profile_guard hook to exactly what is listed below.
# Everything not listed is refused.
#
# `contact`, not `contact:verified`: many partner organisations run mail without
# DMARC, and refusing them means silence. This profile can only read THEIR
# thread and reply-all on it, so a spoofed From: gets its answer sent to the real
# address holder. `verified` still reaches ACE in the caller envelope, and manual
# turn mode still puts every send in front of a human.
capabilities:
  ask:
    description: Ask ACE about your programme, by email.
    callers: [contact, member]
    entry: /ace:ask --thread {thread_id}
    tools: [Read, Grep, Glob, Write, "mcp__*canopy-web__who_is_asking"]
    bash:
      - "canopy email read --repo . {thread_id}"
      - "canopy email review-receipt --repo . --body-file {cwd}/*"
      - "canopy email review-receipt --repo . --body-file {cwd}/* --verdict fixed --caught *"
      - "bin/ace-email --reply-all --thread-id {thread_id} --subject-file {cwd}/* --body-file {cwd}/*"
      - "bin/ace-email --reply-all --thread-id {thread_id} --subject-file {cwd}/* --body-file {cwd}/* --no-run-page *"
    read_paths: ["{cwd}/**"]
callers_default: none

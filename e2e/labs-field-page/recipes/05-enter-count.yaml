appId: com.android.chrome
---
# On the open field page: type a quantity + batch and Save. Needs envVars QTY, BATCH.
# Positions are fractions of the 1080x2400 screen, read from the page's own layout (2026-10-30).
- tapOn:
    point: "28%,49%"
- inputText: ${QTY}
- hideKeyboard
- tapOn:
    point: "50%,57%"
- inputText: ${BATCH}
- hideKeyboard
- takeScreenshot: before-save
- tapOn: "Save"
- waitForAnimationToEnd
- takeScreenshot: after-save
- scrollUntilVisible:
    element: "Sent from this phone"
    optional: true
- takeScreenshot: sent-list
